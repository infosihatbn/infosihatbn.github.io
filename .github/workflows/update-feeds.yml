name: Update live feeds

# Refreshes data/feeds.json for the rotating home-page banner:
# Brunei health news, new Southeast Asian eye research, and BIMJ eye articles.
on:
  schedule:
    - cron: "0 22 * * *"   # 6.00 am Brunei time, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds
        run: python3 .github/scripts/update_feeds.py data/feeds.json
      - name: Commit if changed
        run: |
          git config user.name "MataKitani bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update live feeds ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
