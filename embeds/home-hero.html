<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InfoSihat hero</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700;800&display=swap"><style>
/* InfoSihat embed: brand blue + teal from the logo, Lexend display, Atkinson Hyperlegible body (built for low-vision readers) */
:root{
  --ink:#1F2A30; --muted:#4A5A62; --paper:#FFFFFF; --mist:#EEF6F9; --line:#D3E3EA;
  --blue:#4DA3CA; --blue-deep:#1F6E93; --teal:#4FBAB9; --teal-deep:#1C7675;
  --sun:#F4C04E; --sun-soft:#FFF4D6; --alert:#B3261E; --alert-soft:#FDECEA;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:400 18px/1.55 var(--body)}
h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
.wrap{padding:8px 4px 12px}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;
  background:linear-gradient(135deg,var(--mist),#E3F4F3);border-radius:28px;padding:36px 32px}
.chart{display:grid;gap:10px;justify-items:start}
.row{display:flex;align-items:baseline;gap:14px;font-family:var(--display);font-weight:800;letter-spacing:.06em;color:var(--ink);line-height:1}
.row small{font:600 12px/1 var(--display);letter-spacing:.08em;color:var(--teal-deep);min-width:42px}
.r1{font-size:clamp(54px,9vw,88px)} .r2{font-size:clamp(34px,5.6vw,54px)} .r3{font-size:clamp(22px,3.4vw,32px);color:var(--blue-deep)}
.r4{font-size:clamp(15px,2.1vw,19px);color:var(--muted);letter-spacing:.14em}
.tag{margin-top:18px;display:grid;gap:4px}
.tag strong{font:700 clamp(20px,2.6vw,26px)/1.25 var(--display)}
.tag span{color:var(--muted)}
.side{display:grid;gap:16px;justify-items:center;text-align:center}
.side img{width:min(150px,40vw);height:auto}
.word{font:800 clamp(32px,4.6vw,46px)/1 var(--display);letter-spacing:-.01em}
.word b{color:#333;font-weight:800}.word i{font-style:normal;color:var(--teal)}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:600 15px/1 var(--display);color:var(--blue-deep)}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:26px 20px}.side{order:-1}}
</style></head><body><div class="wrap">
<section class="hero" aria-label="InfoSihat">
  <div>
    <p class="eyebrow">Kesihatan Mata · Eye Health</p>
    <div class="chart" aria-hidden="true" style="margin-top:14px">
      <div class="row r1"><small>6/60</small>E</div>
      <div class="row r2"><small>6/24</small>JAGA</div>
      <div class="row r3"><small>6/12</small>MATA KITANI</div>
      <div class="row r4"><small>6/6</small>LOOK AFTER OUR EYES</div>
    </div>
    <div class="tag">
      <strong>Maklumat Kesihatan dihujung Jari</strong>
      <span>Health information at your fingertips, in Bahasa Melayu Brunei and English.</span>
    </div>
  </div>
  <div class="side">
    <svg viewBox="0 0 220 130" width="220" height="130" style="max-width:100%;height:auto" aria-hidden="true">
      <path d="M10 65 Q110 -15 210 65 Q110 145 10 65 Z" fill="#FFFFFF" stroke="#1F6E93" stroke-width="5"/>
      <circle cx="110" cy="65" r="42" fill="#4DA3CA"/><circle cx="110" cy="65" r="42" fill="none" stroke="#4FBAB9" stroke-width="8" opacity=".7"/>
      <circle cx="110" cy="65" r="19" fill="#1F2A30"/><circle cx="122" cy="53" r="7" fill="#FFFFFF"/>
    </svg>
    <div class="word"><b>Info</b><i>Sihat</i></div>
    <span class="pill">Ditulis doktor · Written by doctors</span>
  </div>
</section></div></body></html>
