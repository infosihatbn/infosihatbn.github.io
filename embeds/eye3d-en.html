<title>3D eye model</title>
<style>
:root{--ink:#1F2A30;--muted:#4A5A62;--paper:#FFFFFF;--mist:#EEF6F9;--line:#D3E3EA;--blue:#4DA3CA;--blue-deep:#1F6E93;--teal:#4FBAB9;--alert:#B3261E;
--display:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:400 17px/1.5 var(--body)}
.wrap{display:grid;gap:14px}
.stage{position:relative;height:min(68vh,560px);min-height:380px;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,#24343d 0%,#0d1418 70%);touch-action:none}
canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
.hint span{background:rgba(0,0,0,.45);color:#fff;font:500 13px/1.3 var(--display);padding:7px 11px;border-radius:999px}
.tools{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px}
.tools button{border:0;border-radius:999px;padding:8px 12px;font:600 13px/1 var(--display);background:rgba(255,255,255,.88);color:var(--ink);cursor:pointer}
.tools button[aria-pressed=true]{background:#4FBAB9;color:#fff}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;font:600 12px/1 var(--display);color:#fff;background:rgba(15,25,30,.7);border:1px solid rgba(255,255,255,.35);padding:5px 8px;border-radius:999px;white-space:nowrap;transition:opacity .2s}
.labs[hidden]{display:none}
.conds{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.conds button{flex:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 14px;font:600 15px/1 var(--display);cursor:pointer;white-space:nowrap}
.conds button[aria-pressed=true]{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
.info{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:18px;padding:16px 18px}
.info h3{margin:0 0 6px;font:700 20px/1.25 var(--display)}
.info p{margin:0 0 8px}.info ul{margin:0;padding-left:20px}.info li{margin:3px 0}
.info a{color:var(--blue-deep);font-weight:700}
.load{position:absolute;inset:0;display:grid;place-items:center;color:#cfe3ea;font:600 15px var(--display)}
.err{padding:16px;border-radius:14px;background:#FDECEA;color:#7a1d17}
@media (max-width:560px){.stage{height:420px}.tools button{padding:7px 10px;font-size:12px}}
</style>
<style>@media screen{html[data-theme=dark]{--ink:#E6EEF2;--muted:#A9BAC3;--paper:#16232B;--mist:#1E313B;--line:#2F4651;--blue-deep:#8CCBEA;--teal-deep:#7FD6D4;--sun-soft:#3A3220;--alert-soft:#3B1D1B;color-scheme:dark}html[data-theme=dark] .brand img{border-radius:50%}html[data-theme=dark] .tools button{background:rgba(28,28,28,.88)!important}html[data-theme=dark] .lab{border:1px solid rgba(66,66,66,.35)!important}html[data-theme=dark] .conds button[aria-pressed=true]{background:#1F6E93!important;border-color:#1F6E93!important}html[data-theme=dark] .err{background:#341c19!important;color:#f2bfbc!important}}</style><script>(()=>{const a=()=>{try{const t=localStorage.getItem('is-theme');document.documentElement.dataset.theme=t||'light'}catch(e){}};a();addEventListener('storage',a);setInterval(a,1500)})()</script></head>

{const p=coGeo.attributes.position,uv=coGeo.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,.5+p.getX(i)/(2*LIMB),.5+p.getY(i)/(2*LIMB))}

const retina=new THREE.Mesh(retGeo,M({map:reT,roughness:.65,side:THREE.DoubleSide}));eye.add(retina);
const DEG=1024/(AMAX*180/Math.PI); // px per degree
const D=(deg)=>deg*DEG, CX=1024, CY=1024, DISC=[CX-D(15),CY+D(1.5)];
let vessels=[];
function genVessels(){const R=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(29);vessels=[];
 function branch(x,y,ang,len,w,art,depth,curve){const pts=[[x,y]];let a=ang;for(let s=0;s<14;s++){a+=curve+(R()-.5)*.18;x+=Math.cos(a)*len/14;y+=Math.sin(a)*len/14;pts.push([x,y])}vessels.push({pts,w,art});
  if(depth>0){for(let k=4;k<13;k+=4+((R()*3)|0)){const [bx,by]=pts[k];const side=R()<.5?-1:1;branch(bx,by,a+side*(.45+R()*.4),len*(.4+R()*.15),w*.68,art,depth-1,curve*.3)}}}
 for(const art of [false,true]){const o=art?.06:0;
  branch(DISC[0]+3,DISC[1]-D(1.5),-1.38+o,D(50),art?6:8.5,art,2,.07);   // superotemporal arcade, curving round the macula
  branch(DISC[0]+3,DISC[1]+D(1.5),1.38-o,D(50),art?6:8.5,art,2,-.07);   // inferotemporal arcade
  branch(DISC[0]-3,DISC[1]-D(1.5),-2.2+o,D(36),art?4.5:6,art,1,-.02);   // nasal
  branch(DISC[0]-3,DISC[1]+D(1.5),2.2-o,D(36),art?4.5:6,art,1,.02)}
 for(let i=0;i<8;i++){const a=-.9+i*.26;branch(DISC[0]+D(2.6)*Math.cos(a),DISC[1]+D(2.6)*Math.sin(a),a*.5,D(9),1.5,i%2==0,0,(R()-.5)*.04)}}
genVessels();
function drawRetina(f){const g=reC.getContext('2d');g.setTransform(1,0,0,1,0,0);
 let b=g.createRadialGradient(CX,CY,0,CX,CY,1024);b.addColorStop(0,'#b8452a');b.addColorStop(.35,'#c2532e');b.addColorStop(.75,'#a2381f');b.addColorStop(1,'#6e2414');g.fillStyle=b;g.fillRect(0,0,2048,2048);
 const R=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(3);
 for(let i=0;i<5000;i++){const x=R()*2048,y=R()*2048,s=3+R()*9;g.fillStyle=`rgba(${R()<.5?110:205},${R()<.5?30:80},20,${.05+R()*.06})`;g.beginPath();g.ellipse(x,y,s,s*.5,R()*3,0,7);g.fill()}
 b=g.createRadialGradient(CX,CY,0,CX,CY,D(9));b.addColorStop(0,'rgba(70,15,8,.75)');b.addColorStop(1,'rgba(70,15,8,0)');g.fillStyle=b;g.beginPath();g.arc(CX,CY,D(9),0,7);g.fill();
 g.fillStyle='rgba(255,230,180,.75)';g.beginPath();g.arc(CX,CY,3,0,7);g.fill();
 g.strokeStyle='rgba(255,220,190,.18)';g.lineWidth=3;g.beginPath();g.arc(CX,CY,D(2.5),0,7);g.stroke();
 const [dx,dy]=DISC;b=g.createRadialGradient(dx,dy,0,dx,dy,D(3.2));b.addColorStop(0,'#fff6d8');b.addColorStop(.35,'#f6d39a');b.addColorStop(.8,'#e7a77a');b.addColorStop(1,'rgba(200,100,60,0)');g.fillStyle=b;g.beginPath();g.ellipse(dx,dy,D(2.9),D(3.3),0,0,7);g.fill();
 g.fillStyle='rgba(255,252,235,.9)';g.beginPath();g.ellipse(dx+3,dy,D(.9),D(1.1),0,0,7);g.fill();
 g.lineCap='round';g.lineJoin='round';
 for(const v of vessels){g.strokeStyle=v.art?'#b8302a':'#86201a';g.lineWidth=v.w;g.beginPath();v.pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
  if(v.w>3){g.strokeStyle=v.art?'rgba(255,170,150,.35)':'rgba(200,90,80,.25)';g.lineWidth=v.w*.2;g.stroke()}}
 if(f.dr||f.dmo){const R2=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(41);
  for(let i=0;i<(f.dr?75:15);i++){const a=R2()*6.28,d=D(5+R2()*38),x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d*.8;if(Math.hypot(x-dx,y-dy)<D(4))continue;const blot=R2()<.3,s=blot?4.5+R2()*4.5:2+R2()*2;
   g.fillStyle=blot?'rgba(110,8,8,.9)':'rgba(140,10,10,.95)';g.beginPath();blot?g.ellipse(x,y,s,s*(.7+R2()*.3),R2()*3,0,7):g.arc(x,y,s,0,7);g.fill()}
  const ring=(cx,cy,rad,n)=>{for(let i=0;i<n;i++){const a=R2()*6.28,rr=rad*(.8+R2()*.4),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr,s=2+R2()*4.5;g.fillStyle=`rgba(255,${215+R2()*30|0},${90+R2()*50|0},.95)`;g.beginPath();g.arc(x,y,s,0,7);g.fill()}};
  if(f.dr){ring(CX+D(7),CY-D(5),D(3.2),45);ring(CX-D(9),CY+D(6),D(2.5),30);
   for(let i=0;i<3;i++){const x=CX+D(-12+i*11),y=CY+D(i%2?-10:9);for(let j=0;j<5;j++){const xx=x+(R2()-.5)*D(1.2),yy=y+(R2()-.5)*D(.8),rr=D(.6+R2()*.5);const r=g.createRadialGradient(xx,yy,0,xx,yy,rr);r.addColorStop(0,'rgba(250,248,235,.85)');r.addColorStop(1,'rgba(250,248,235,0)');g.fillStyle=r;g.beginPath();g.arc(xx,yy,rr,0,7);g.fill()}}}
  if(f.dmo){g.save();g.globalCompositeOperation='destination-out';const ho=g.createRadialGradient(CX,CY,0,CX,CY,D(5.5));ho.addColorStop(0,'rgba(0,0,0,.5)');ho.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=ho;g.beginPath();g.arc(CX,CY,D(5.5),0,7);g.fill();g.restore();ring(CX,CY,D(4.5),70);b=g.createRadialGradient(CX,CY,0,CX,CY,D(6));b.addColorStop(0,'rgba(255,235,200,.28)');b.addColorStop(1,'rgba(255,235,200,0)');g.fillStyle=b;g.beginPath();g.arc(CX,CY,D(6),0,7);g.fill()}}
 if(f.rd){const N=512,id=g.createImageData(N,N),sc=2048/N;
  for(let py=0;py<N;py++)for(let px=0;px<N;px++){const ux=(px*sc-CX)/1024*AMAX,uy=-(py*sc-CY)/1024*AMAX,w=rdW8(ux,uy);if(w<=0)continue;
   const al=Math.hypot(ux,uy),az=Math.atan2(uy,ux),fold=Math.sin(az*6+al*4)+.6*Math.sin(az*13-al*9),k=(px+py*N)*4,sh=1-.25*Math.max(0,fold-.4);
   id.data[k]=200*sh;id.data[k+1]=196*sh;id.data[k+2]=192*sh;id.data[k+3]=255*Math.min(.78,Math.pow(w,.6)*.7)}
  const tc=canvas(N,N);tc.getContext('2d').putImageData(id,0,0);g.drawImage(tc,0,0,2048,2048);
  const tx=CX+.62*1024/AMAX,ty=CY-1.0*1024/AMAX;g.save();g.translate(tx,ty);g.rotate(-.5);g.fillStyle='#7a140c';g.beginPath();g.moveTo(-D(7),0);g.quadraticCurveTo(0,D(11),D(7),0);g.quadraticCurveTo(0,D(4),-D(7),0);g.fill();
  g.strokeStyle='rgba(235,230,225,.9)';g.lineWidth=4;g.beginPath();g.moveTo(-D(7),0);g.quadraticCurveTo(0,D(4),D(7),0);g.stroke();g.restore()}
 reT.needsUpdate=true}

// retinal shape: macular swelling, detachment
const pos=retGeo.attributes.position,AL=new Float32Array(pos.count),AZ=new Float32Array(pos.count),RDW=new Float32Array(pos.count);
const sst=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
function rdW8(ux,uy){const al=Math.hypot(ux,uy);if(al>AMAX)return 0;const edge=-.34+.12*Math.sin(ux*3.2+.6);return sst(edge,edge+.4,uy)*sst(AMAX-.03,AMAX-.5,al)*sst(.1,.3,Math.hypot(ux+.262,uy+.026))}
for(let i=0;i<pos.count;i++){const x=base[i*3],y=base[i*3+1],z=base[i*3+2];AL[i]=Math.acos(Math.max(-1,Math.min(1,-z/RR)));AZ[i]=Math.atan2(y,x);RDW[i]=rdW8(Math.cos(AZ[i])*AL[i],Math.sin(AZ[i])*AL[i])}
function shapeRetina(f,t=0){const v=new THREE.Vector3();for(let i=0;i<pos.count;i++){v.fromArray(base,i*3);let lift=0,sag=0;const al=AL[i],az=AZ[i];
  if(f.dmo){const d=al/(10*Math.PI/180);if(d<2)lift+=.15*Math.exp(-d*d*1.3)*(1-.25*Math.exp(-(d*d)/.02))}
  if(f.rd&&RDW[i]>0){const w=RDW[i];lift+=.46*Math.pow(w,1.1)*(1+w*(.07*Math.sin(az*6+al*4+t*1.2)+.04*Math.sin(az*13-al*9+t*.8)));sag=.22*w*w*(1+.12*Math.sin(t*.9+al*3))}
  v.multiplyScalar((RR-lift)/RR);v.y-=sag;pos.setXYZ(i,v.x,v.y,v.z)}pos.needsUpdate=true;retGeo.computeVertexNormals()}
// RPE / choroid colour seen under lifted retina
const rpe=shell(RR+.006,Math.PI-AMAX,Math.PI,M({color:0xa4462a,roughness:.85,side:THREE.BackSide}),128);rpe.visible=false;eye.add(rpe);
// fluid under the macula
const fluid=new THREE.Mesh(new THREE.SphereGeometry(1,48,24),P({color:0xf5dd9a,transmission:.4,transparent:true,opacity:.65,roughness:.15,side:THREE.DoubleSide}));fluid.scale.set(.13,.13,.06);fluid.position.set(0,0,-RR+.045);eye.add(fluid);

// ---------- optic nerve ----------
const nervePos=new THREE.Vector3(-Math.sin(15*Math.PI/180),-Math.sin(1.5*Math.PI/180),-Math.cos(15*Math.PI/180)).multiplyScalar(.98);
const nerve=new THREE.Mesh(new THREE.CylinderGeometry(.14,.17,.9,32),M({color:0xe9d6b5,roughness:.6}));nerve.position.copy(nervePos.clone().multiplyScalar(1.5));nerve.lookAt(0,0,0);nerve.rotateX(Math.PI/2);eye.add(nerve);

// ---------- vitreous: haemorrhage, floaters, inflammation ----------
const vitMat=P({color:0xffffff,transparent:true,opacity:0,roughness:.9,depthWrite:false,side:THREE.BackSide});
const vit=new THREE.Mesh(new THREE.SphereGeometry(.94,64,32),vitMat);eye.add(vit);
function sprite(col){const c=canvas(64,64),g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return tex(c)}
function cloud(n,col,size,bias){const g=new THREE.BufferGeometry(),a=new Float32Array(n*3);for(let i=0;i<n;i++){let x,y,z;do{x=rnd()*2-1;y=rnd()*2-1;z=rnd()*2-1}while(x*x+y*y+z*z>1);y=y*.85-bias*Math.abs(rnd());a.set([x*.8,Math.max(-.82,y*.8),z*.75-.12],i*3)}g.setAttribute('position',new THREE.BufferAttribute(a,3));
 const m=new THREE.PointsMaterial({map:sprite(col),size,transparent:true,depthWrite:false,sizeAttenuation:true});m.clippingPlanes=[CUT];clipMats.push(m);const p=new THREE.Points(g,m);p.visible=false;eye.add(p);return p}
const blood=cloud(900,'rgba(140,12,12,.22)',.42,.5), blood2=cloud(140,'rgba(80,0,0,.6)',.12,.7), pus=cloud(1600,'rgba(240,235,200,.45)',.2,.1);
const floaters=new THREE.Group();floaters.visible=false;eye.add(floaters);
{const fm=M({color:0x2b2b2b,transparent:true,opacity:.4,roughness:1,depthWrite:false});
 for(let i=0;i<9;i++){const pts=[];let p=new THREE.Vector3((rnd()-.5)*.9,(rnd()-.5)*.9,(rnd()-.6)*.8);for(let k=0;k<6;k++){pts.push(p.clone());p.add(new THREE.Vector3((rnd()-.5)*.14,(rnd()-.5)*.14,(rnd()-.5)*.14))}
  floaters.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,.004+rnd()*.005,6),fm))}
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.07,.008,8,48),fm);ring.position.copy(nervePos).multiplyScalar(.55);ring.lookAt(nervePos);floaters.add(ring)}
// hypopyon
const hypo=new THREE.Mesh((()=>{const s=new THREE.Shape(),r=LIMB-.04,y0=-.33;const a0=Math.asin(y0/r);s.absarc(0,0,r,Math.PI-a0,2*Math.PI+a0,false);s.lineTo(r*Math.cos(Math.PI-a0),y0);return new THREE.ExtrudeGeometry(s,{depth:.1,bevelEnabled:false})})(),M({color:0xf1ead0,roughness:.5,transparent:true,opacity:.92}));
hypo.position.z=iris.position.z+.005;hypo.visible=false;eye.add(hypo);

// ---------- labels ----------
const LAB=[['cornea',new THREE.Vector3(.2,.25,1.08)],['iris',new THREE.Vector3(-.05,.33,.86)],['lens',new THREE.Vector3(0,-.22,LZ)],['vitreous',new THREE.Vector3(0,.35,-.15)],['retina',new THREE.Vector3(-.2,-.8,-.5)],['macula',new THREE.Vector3(.04,-.08,-.93)],['disc',nervePos.clone().multiplyScalar(.97).add(new THREE.Vector3(0,.08,0))],['nerve',nervePos.clone().multiplyScalar(1.95).add(new THREE.Vector3(0,-.15,0))],['sclera',new THREE.Vector3(-.75,.62,.2)]];
const labEls=LAB.map(([k])=>{const e=document.createElement('div');e.className='lab';e.textContent=TXT.lab[k];labs.appendChild(e);return e});

// ---------- conditions ----------
const VIEWS={cornea:[[.5,-.8,2.0],[.09,-.12,.98]],mac:[[.5,.32,-.3],[0,-.02,-.92]],side:[[2.1,.75,1.85],[-.1,0,-.15]],front:[[.15,.1,2.6],[0,0,.6]],fundus:[[0,0,.05],[0,0,-.95]]};
let tween=null;
function view(n){const [p,t]=VIEWS[n];const fit=(n==='side'||n==='front'||n==='cornea')&&camera.aspect<1.1?Math.min(2,1.1/camera.aspect):1;const T1=new THREE.Vector3(...t),P1=new THREE.Vector3(...p).sub(T1).multiplyScalar(fit).add(T1);tween={p0:camera.position.clone(),t0:controls.target.clone(),p1:P1,t1:T1,s:performance.now()};
 document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===n));curView=n}
let curView='side';
const INNER={macula:1,disc:1},OUTER={cornea:1,iris:1,sclera:1};
function setCut(on){cutOn=on;clipMats.forEach(m=>m.clippingPlanes=on?[CUT]:[]);document.getElementById('cut').setAttribute('aria-pressed',on)}
let curK='normal',fr=0;
function apply(k){const f={dr:k==='dr',dmo:k==='dmo',rd:k==='rd'};
 retina.material.transparent=!!f.dmo;retina.material.needsUpdate=true;drawRetina(f);shapeRetina(f);fluid.visible=k==='dmo';rpe.visible=f.rd||f.dmo;curK=k;CUT.constant=k==='dmo'?0:.3;
 drawCornea(k==='cu'?'cu':k==='sei'?'sei':'');
 blood.visible=blood2.visible=k==='vh';floaters.visible=k==='fl';pus.visible=hypo.visible=k==='endo';
 vitMat.opacity=k==='endo'?.28:k==='vh'?.12:0;vitMat.color.set(k==='vh'?0x7a1010:0xf2ead0);
 drawSclera(k==='endo'?2:k==='cu'?1:0);
 const cat=k==='cat';nucleus.material.opacity=cat?.8:0;cortex.material.opacity=cat?.85:0;lensMat.opacity=cat?.75:.35;lensMat.transmission=cat?.3:.95;lensMat.color.set(cat?0xf1e2b8:0xfaf7ee);
 const c=TXT.c[k];document.getElementById('info').innerHTML=`<h3>${c.n}</h3><p>${c.d}</p><ul>${c.s.map(x=>`<li>${x}</li>`).join('')}</ul>`+(LINKS[k]?`<p style="margin:10px 0 0"><a href="${LINKS[k]}" target="_top">${TXT.more} →</a></p>`:'');
 document.querySelectorAll('#conds button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
 view(c.v);setCut(c.v==='side'||c.v==='mac')}
const conds=document.getElementById('conds');
Object.keys(TXT.c).forEach(k=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.textContent=TXT.c[k].n;b.onclick=()=>apply(k);conds.appendChild(b)});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
document.getElementById('cut').onclick=()=>setCut(!cutOn);
document.getElementById('lbl').onclick=e=>{labs.hidden=!labs.hidden;e.currentTarget.setAttribute('aria-pressed',!labs.hidden)};

// ---------- loop ----------
camera.position.set(...VIEWS.side[0]);controls.target.set(0,0,0);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
const v3=new THREE.Vector3(),clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime();
 if(tween){const k=Math.min(1,(performance.now()-tween.s)/900),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(k>=1)tween=null}
 controls.update();
 if(floaters.visible){floaters.rotation.y=Math.sin(t*.4)*.12;floaters.position.y=Math.sin(t*.7)*.03}
 if(blood.visible){blood.rotation.y=t*.03;blood2.rotation.y=-t*.02}
 if(pus.visible)pus.rotation.y=t*.02;
 if(curK==='rd'&&(++fr&1))shapeRetina({rd:1},t);
 inner.position.copy(camera.position).multiplyScalar(.2);
 renderer.render(scene,camera);
 if(!labs.hidden){const w=stage.clientWidth,h=stage.clientHeight;LAB.forEach(([k,p],i)=>{v3.copy(p).project(camera);const e=labEls[i];const inside=camera.position.length()<.95;const hidden=v3.z>1||Math.abs(v3.x)>1.05||Math.abs(v3.y)>1.05||(cutOn&&p.x>CUT.constant+.02)||(inside&&!INNER[k])||(!inside&&!cutOn&&!OUTER[k]);e.style.opacity=hidden?0:1;e.style.left=(v3.x*.5+.5)*w+'px';e.style.top=(-v3.y*.5+.5)*h+'px'})}});
apply('normal');
</script>
