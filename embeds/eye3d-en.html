<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D eye model</title>
<style>
:root{--ink:#173A2E;--muted:#4F6359;--paper:#FFFFFF;--mist:#E8F0E9;--line:#DDE7DD;--blue-deep:#154A32;--teal:#E8B820;
--display:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--ink);font:400 16px/1.5 var(--body);overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.stage{position:relative;flex:1;min-height:240px;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,#2b3d36 0%,#0e1714 72%);touch-action:none}
canvas{display:block;width:100%;height:100%;outline:none}
.hint{position:absolute;left:10px;bottom:10px;pointer-events:none;background:rgba(0,0,0,.45);color:#fff;font:500 12px/1.3 var(--display);padding:6px 10px;border-radius:999px;transition:opacity .6s}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;font:600 12px/1 var(--display);color:#fff;background:rgba(14,23,20,.72);border:1px solid rgba(255,255,255,.35);padding:5px 8px;border-radius:999px;white-space:nowrap;transition:opacity .2s}
.lab.pin{background:#E8B820;color:#2a140a;border-color:#fff;font-weight:700}
.labs[hidden]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--mist);border-radius:999px;padding:3px}
.bar button{border:0;border-radius:999px;padding:9px 11px;min-height:38px;font:600 12.5px/1 var(--display);background:transparent;color:var(--blue-deep);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--blue-deep);color:#fff}
.tg{background:var(--paper)!important;border:1.5px solid var(--line)!important}
.tg[aria-pressed=true]{border-color:var(--blue-deep)!important}
.ic{font-size:17px!important;padding:0!important;width:38px}
.tg[aria-pressed=true]::before{content:"✓ "}
.act{background:var(--teal)!important;color:#2a140a!important}
.bar button:focus-visible{outline:3px solid #E8B820;outline-offset:2px}
.load{position:absolute;inset:0;display:grid;place-items:center;color:#d9e8df;font:600 15px var(--display)}
.err{margin:16px;padding:16px;border-radius:14px;background:#FDECEA;color:#7a1d17}
@media (max-width:560px){.bar button{padding:8px 10px;font-size:12px;min-height:36px}.bar{gap:5px}}
</style>
<style>@media screen{html[data-theme=dark]{--ink:#E8EFEA;--muted:#AFC0B5;--paper:#17211C;--mist:#1F2E27;--line:#31453A;--blue-deep:#9FD6B8;--teal-deep:#F5B496;--sun-soft:#3A2A20;--alert-soft:#3B1D1B;--cream:#121A16;color-scheme:dark}html[data-theme=dark] .brand img{border-radius:50%}html[data-theme=dark] .accb,html[data-theme=dark] .music-btn{color:#CFE9DA!important;background:#24332B!important}html[data-theme=dark] .music-btn[aria-pressed="true"]{background:#2E6B53!important;color:#fff!important}html[data-theme=dark] .wa-share{background:#167C40!important}html[data-theme=dark] .band svg.leaves{opacity:.22}html[data-theme=dark] .search{background:linear-gradient(135deg,#1F4A3A,#24533F 60%,#2D4B45)!important}html[data-theme=dark] body .dot.dot,html[data-theme=dark] body .key .dot.dot{color:#1B120D!important}html[data-theme=dark] h3{--alert:#FF9C8F}html[data-theme=dark] button.act,html[data-theme=dark] body .act{color:#2A140A!important}html[data-theme=dark] .lab{border:1px solid rgba(66,66,66,.35)!important}html[data-theme=dark] .lab.pin{color:#f9ede8!important;border-color:#424242!important}html[data-theme=dark] .seg button[aria-pressed=true]{background:#154A32!important}html[data-theme=dark] .tg[aria-pressed=true]{border-color:#154A32!important}html[data-theme=dark] .act{color:#f9ede8!important}html[data-theme=dark] .err{background:#341c19!important;color:#f2bfbc!important}}</style><script>(()=>{const a=()=>{try{const t=localStorage.getItem('is-theme');document.documentElement.dataset.theme=t||'light'}catch(e){}};a();addEventListener('storage',a);setInterval(a,1500)})()</script></head>
<body>
<div class="wrap">
 <div class="stage" id="stage"><div class="load" id="load">Loading the 3D eye…</div>
  <div class="labs" id="labs"></div>
  <div class="hint" id="hint">Drag to turn · pinch or scroll to zoom</div>
 </div>
 <div class="bar" id="bar">
  <span class="seg" role="group" aria-label="View"><button type="button" data-v="side" aria-pressed="true">Side (cut open)</button><button type="button" data-v="front" aria-pressed="false">Front</button><button type="button" data-v="fundus" aria-pressed="false">Inside (retina)</button></span>
  <button type="button" class="tg" id="lbl" aria-pressed="true">Labels</button>
  <button type="button" class="tg" id="cut" aria-pressed="true">Cut open</button>
  <button type="button" class="act" id="move">▶ Move the eye</button>
  <button type="button" class="tg ic" id="reset" aria-label="Reset" title="Reset">⟲</button>
 </div>
</div>

<script type="module">
import * as THREE from 'three';

// This is a LEFT eye: optic disc is nasal (-x), temporal is +x, superior is +y, front (cornea) is +z.

const clipMats=[];
function M(o,clip=true){const m=new THREE.MeshStandardMaterial(o);if(clip){m.clippingPlanes=[CUT];m.clipShadows=true;clipMats.push(m)}return m}

const seeded=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const rnd=seeded(7);

// ---------- canvas helpers ----------

 const gr=g.createLinearGradient(0,0,0,1024);gr.addColorStop(0,'rgba(240,215,205,.35)');gr.addColorStop(.35,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,2048,1024);
 if(red){const r=g.createLinearGradient(0,0,0,300);r.addColorStop(0,`rgba(200,40,40,${.3+red*.3})`);r.addColorStop(1,'rgba(200,40,40,0)');g.fillStyle=r;g.fillRect(0,0,2048,300)}
 const R=seeded(11);
 for(let i=0;i<(red?200:120);i++){let x=R()*2048,y=250+R()*90;g.strokeStyle=`rgba(${170+R()*40|0},${30+R()*30|0},${35+R()*20|0},${(red?.5:.3)+R()*.25})`;g.lineWidth=.6+R()*(red?1.8:1.2);g.beginPath();g.moveTo(x,y);
  for(let k=0;k<7;k++){x+=(R()-.5)*40;y-=12+R()*30;g.lineTo(x,Math.max(y,0))}g.stroke()}

for(let k=0;k<4;k++){const g=new THREE.SphereGeometry(1.018,16,40,k*Math.PI/2-.2,.4,1.0+[0,.08,.04,.1][k],1.6);g.rotateX(Math.PI/2);muscles.add(new THREE.Mesh(g,M({map:musT,roughness:.75,side:THREE.DoubleSide})))}

const coGeo=capGeo(RC+.004);

const corneaBack=new THREE.Mesh(backGeo,backMat);corneaBack.visible=false;eye.add(corneaBack);

   if(k==='cu'&&!back){const r=Math.hypot(v.x-UL[0],v.y-UL[1])/ur;if(r<1)d=-.065*(.6+.5*s)*Math.pow(1-r*r,.7);else if(r<1.7)d=.012*Math.sin((r-1)/.7*Math.PI)}
   if(k==='kc'){const r=Math.hypot(v.x-KC[0],v.y-KC[1])/.24,bump=Math.exp(-r*r*1.5)*edge;d+=kA*bump+(back?(.03+.006*s)*bump:0)}
   if(k==='ast'){const ph=Math.atan2(v.y,v.x);d+=-aA*Math.cos(2*ph)*4*rl*rl*(1-rl*rl)*edge}
   if(d){n.copy(v).sub(c).normalize();v.addScaledVector(n,d)}p.setXYZ(i,v.x,v.y,v.z)}
  p.needsUpdate=true;geo.computeVertexNormals()}}

 if(mode==='cu'){const x=X(UL[0]),y=Y(UL[1]),R0=px(UL[2]*(.65+.7*s));
  let r=g.createRadialGradient(x,y,R0*.6,x,y,R0*2.3);r.addColorStop(0,'rgba(235,235,225,.6)');r.addColorStop(1,'rgba(235,235,225,0)');g.fillStyle=r;g.beginPath();g.arc(x,y,R0*2.3,0,7);g.fill();
  const RU=seeded(5);
  g.beginPath();for(let a=0;a<6.3;a+=.12){const rr=R0*(.95+Math.sin(a*5)*.06+RU()*.06);g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();

  g.save();g.clip();r=g.createRadialGradient(x+R0*.1,y+R0*.35,R0*.55,x+R0*.1,y+R0*.35,R0*1.25);r.addColorStop(0,'rgba(90,75,50,0)');r.addColorStop(1,'rgba(90,75,50,.6)');g.fillStyle=r;g.fillRect(x-R0,y-R0,R0*2,R0*2);g.restore();

  for(let i=0;i<26;i++){const a=RU()*6.28,d=R0*(1+RU()*.5);g.strokeStyle='rgba(250,250,240,.5)';g.lineWidth=2+RU()*3;g.beginPath();g.moveTo(x+Math.cos(a)*R0*.95,y+Math.sin(a)*R0*.95);g.lineTo(x+Math.cos(a+(RU()-.5)*.3)*d,y+Math.sin(a+(RU()-.5)*.3)*d);g.stroke()}}
 if(mode==='sei'){const RS=seeded(17),n=10+Math.round(s*40);for(let i=0;i<n;i++){const a=RS()*6.28,d=Math.sqrt(RS())*300,x=512+Math.cos(a)*d,y=512+Math.sin(a)*d,sz=9+RS()*14;const r=g.createRadialGradient(x,y,0,x,y,sz);r.addColorStop(0,'rgba(255,255,250,.85)');r.addColorStop(1,'rgba(255,255,250,0)');g.fillStyle=r;g.beginPath();g.arc(x,y,sz,0,7);g.fill()}}
 // Placido-style light rings reflected off the cornea (how corneal shape is measured)

  for(let i=1;i<=5;i++){const r0=i*52;ring(g,512+(cx-512)*.5,512+(cy-512)*.5,a=>{const toward=Math.max(0,Math.cos(a-Math.atan2(cy-512,cx-512)));const k=1-q*toward*toward*(1-i*.08);return [r0*k,r0*k]},'rgba(255,255,255,.75)',4)}

 coT.needsUpdate=true;coOver.visible=!!mode}

// ---------- iris ----------
const irC=canvas(1024,1024),ig=irC.getContext('2d');
{ig.translate(512,512);const b=ig.createRadialGradient(0,0,60,0,0,500);b.addColorStop(0,'#2a170e');b.addColorStop(.35,'#5a3520');b.addColorStop(.7,'#3A2E05');b.addColorStop(1,'#20120a');ig.fillStyle=b;ig.beginPath();ig.arc(0,0,512,0,7);ig.fill();
 for(let i=0;i<900;i++){const a=rnd()*6.283,r0=130+rnd()*60,r1=300+rnd()*200;ig.strokeStyle=`rgba(${120+rnd()*80|0},${70+rnd()*50|0},${30+rnd()*30|0},${.15+rnd()*.3})`;ig.lineWidth=1+rnd()*2.5;ig.beginPath();ig.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ig.quadraticCurveTo(Math.cos(a+.05)*(r0+r1)/2,Math.sin(a+.05)*(r0+r1)/2,Math.cos(a)*r1,Math.sin(a)*r1);ig.stroke()}
 ig.strokeStyle='rgba(150,95,50,.6)';ig.lineWidth=10;ig.beginPath();for(let a=0;a<6.3;a+=.05){const r=230+Math.sin(a*14)*14;ig.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ig.closePath();ig.stroke()}
const irisGeo=new THREE.RingGeometry(.13,LIMB-.01,96,4);{const p=irisGeo.attributes.position,uv=irisGeo.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,.5+p.getX(i)/(2*LIMB),.5+p.getY(i)/(2*LIMB))}

// ---------- lens ----------
const LZ=iris.position.z-.17;

const lens=new THREE.Mesh(new THREE.SphereGeometry(1,64,32),lensMat);lens.scale.set(.37,.37,.16);lens.position.z=LZ;eye.add(lens);

const cortC=canvas(512,512),cortT=tex(cortC);{const g=cortC.getContext('2d');g.translate(256,256);for(let i=0;i<14;i++){const a=rnd()*6.28;g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.moveTo(Math.cos(a)*250,Math.sin(a)*250);g.lineTo(Math.cos(a+.12)*250,Math.sin(a+.12)*250);g.lineTo(Math.cos(a+.05)*(110+rnd()*60),Math.sin(a+.05)*(110+rnd()*60));g.fill()}}

// ---------- retina (azimuthal projection around posterior pole) ----------

const base=retGeo.attributes.position.array.slice();
{const p=retGeo.attributes.position,uv=retGeo.attributes.uv;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),al=Math.acos(Math.max(-1,Math.min(1,-z/RR))),h=Math.hypot(x,y)||1;uv.setXY(i,.5+.5*al/AMAX*x/h,.5+.5*al/AMAX*y/h)}}

// "Move the eye": quick look right, look left, back to centre (like real eye movements) so you can watch the contents slosh
document.getElementById('move').onclick=()=>{tween=null;shake={s:performance.now(),off:camera.position.clone().sub(controls.target),up:camera.up.clone()};controls.enabled=false;wake()};
const KF=RM?[[0,0],[.6,.35],[1.4,.35],[2,0]]:[[0,0],[.18,1],[.9,1],[1.12,-1],[1.9,-1],[2.1,0],[2.9,0]];

['pointerdown','wheel','touchstart'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>{hint.style.opacity=0;tween=null;if(shake){shake=null;controls.enabled=true}},{passive:true}));
controls.addEventListener('change',()=>{dirty=true;quiet=0});

// ---------- parent page link (shared condition picker, 2D preview) ----------
const inFrame=window.parent!==window;
function post(m){if(inFrame)try{parent.postMessage(Object.assign({eye3d:1},m),'*')}catch(e){}}
addEventListener('message',e=>{const d=e.data;if(!d||!d.eye3d||(inFrame&&e.source!==parent))return;
 if(d.cmd==='set'){if(d.k!==curK||Math.abs(d.sev-curS)>.001)apply(d.k,d.sev,d.k===curK)}
 if(d.cmd==='move')document.getElementById('move').click()});

// ---------- loop (renders only while something moves; stops when hidden or scrolled away) ----------
camera.position.set(...VIEWS.side[0]);controls.target.set(0,0,0);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true;wake()}
const v3=new THREE.Vector3(),clock=new THREE.Clock(),qPrev=camera.quaternion.clone(),dq=new THREE.Quaternion(),w=new THREE.Vector3(),ax=new THREE.Vector3();
const ANIM={fl:1,vh:1,endo:1,rd:1};let tIdle=0,half=0;
function frame(){const dt=Math.min(clock.getDelta(),1/20);
 if(tween){const k=Math.min(1,(performance.now()-tween.s)/900),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(k>=1)tween=null;dirty=true}
 if(shake){const a=shakeAt((performance.now()-shake.s)/1000);if(a===null){shake=null;controls.enabled=true}else{camera.position.copy(shake.off).applyAxisAngle(shake.up,a*.55).add(controls.target);camera.lookAt(controls.target);dirty=true}}
 if(!shake&&controls.update())dirty=true;

 dq.copy(camera.quaternion).multiply(qPrev.clone().invert());qPrev.copy(camera.quaternion);

  for(const s of Object.values(SP))s.kick(w,LAG);
  ax.copy(w).applyQuaternion(camera.quaternion.clone().invert());post({cmd:'rot',x:ax.y,y:ax.x})}
 let act=false;for(const s of Object.values(SP)){s.step(dt);if(s.e()>2e-6)act=true}
 for(const [o,s] of SLOSH)if(o.visible)s.apply(o);
 const idle=!RM&&ANIM[curK];if(idle)tIdle+=dt;
 if(floatA.visible&&!RM){floatA.position.y=Math.sin(tIdle*.4)*.025;floatB.position.y=Math.sin(tIdle*.33+1)*.03;floatB.position.x=Math.sin(tIdle*.21)*.02}
 if(curK==='rd'&&(idle||act)&&(++fr&1))shapeRetina(curF,tIdle,SP.rd.r);
 if(act)dirty=true;else if(idle&&(++half&1))dirty=true; // idle drift at ~30 fps to save battery
 if(!dirty){if(++quiet>30)sleep();return}
 quiet=0;dirty=false;
 inner.position.copy(camera.position).multiplyScalar(.2);
 renderer.render(scene,camera);
 if(!labs.hidden){const W2=stage.clientWidth,H2=stage.clientHeight,inside=camera.position.length()<.95;
  const put=(e,p,always)=>{v3.copy(p).project(camera);const hid=v3.z>1||Math.abs(v3.x)>1.05||Math.abs(v3.y)>1.05||(cutOn&&p.x>CUT.constant+.02&&!always)||(!always&&inside&&!INNER[e.dataset.k])||(!always&&!inside&&!cutOn&&!OUTER[e.dataset.k]);e.style.opacity=hid?0:1;e.style.left=(v3.x*.5+.5)*W2+'px';e.style.top=(-v3.y*.5+.5)*H2+'px'};
  LAB.forEach(([k,p],i)=>{labEls[i].dataset.k=k;put(labEls[i],p,false)});
  const pp=PIN[curK];if(pp){v3.set(...pp);const p2=v3.clone();const hid=(!inside&&!cutOn&&p2.length()<.93)||(inside&&p2.z>0&&curK!=='endo');put(pinEl,p2,true);if(hid)pinEl.style.opacity=0}else pinEl.style.opacity=0}}
function wake(){dirty=true;quiet=0;const want=onScreen&&!document.hidden;if(want&&!running){running=true;clock.getDelta();renderer.setAnimationLoop(frame)}}
function sleep(){if(running){running=false;renderer.setAnimationLoop(null)}}
new IntersectionObserver(es=>{onScreen=es[es.length-1].isIntersecting;onScreen?wake():sleep()}).observe(stage);
document.addEventListener('visibilitychange',()=>document.hidden?sleep():wake());

new ResizeObserver(resize).observe(stage);resize();
if(stage.clientWidth<420){labs.hidden=true;document.getElementById('lbl').setAttribute('aria-pressed',false)} // small phones: labels off at first
{let k0='normal';try{const m=(location.hash||(inFrame?parent.location.hash:'')).match(/c=(\w+)/);if(m&&VMAP[m[1]])k0=m[1]}catch(e){}apply(k0,.5)}
window.__eye3d={get k(){return curK},get s(){return curS},get view(){return curView},get running(){return running},slosh:()=>SP.a.r.length()+SP.b.r.length()};
