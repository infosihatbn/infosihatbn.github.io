<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chief Editor and Designer</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700;800&display=swap"><style>
/* MataKitani embed: brand blue + teal from the logo, Lexend display, Atkinson Hyperlegible body (built for low-vision readers) */
:root{
  --ink:#1B2B24; --muted:#55635B; --paper:#FFFFFF; --mist:#EEF4EC; --line:#DDE6DA;
  --blue:#5E9E7E; --blue-deep:#1F5A45; --teal:#EE9670; --teal-deep:#2D6A50;
  --sun:#F5A27C; --sun-soft:#FDEADF; --alert:#B3261E; --alert-soft:#FDECEA;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:400 18px/1.55 var(--body)}
h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
.wrap{padding:8px 4px 12px}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;background:linear-gradient(135deg,var(--mist),#E5EFE6);border-radius:26px;padding:28px}
.av{width:150px;height:150px;flex:none;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;font:800 50px/1 var(--display);letter-spacing:.02em;border:6px solid var(--paper);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.tm h3{font-size:clamp(24px,3.4vw,30px)}
.role{font:600 17px/1.4 var(--display);color:var(--blue-deep);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
@media (max-width:560px){.tm{grid-template-columns:1fr;justify-items:center;text-align:center}.chips{justify-content:center}}
</style><style>@media screen{html[data-theme=dark]{--ink:#E8EFEA;--muted:#AFC0B5;--paper:#17211C;--mist:#1F2E27;--line:#31453A;--blue-deep:#9FD6B8;--teal-deep:#F5B496;--sun-soft:#3A2A20;--alert-soft:#3B1D1B;--cream:#121A16;color-scheme:dark}html[data-theme=dark] .brand img{border-radius:50%}html[data-theme=dark] .tm{background:linear-gradient(135deg,var(--mist),#243a26)!important}}</style><script>(()=>{const a=()=>{try{const t=localStorage.getItem('is-theme');document.documentElement.dataset.theme=t||'light'}catch(e){}};a();addEventListener('storage',a);setInterval(a,1500)})()</script></head><body><div class="wrap">
<section class="tm" aria-label="Chief Editor and Designer">
  <!-- To use a photo: replace the initials below with <img src="PHOTO-ADDRESS" alt="Dr Haziq Aziz Shamri"> -->
  <div class="av" aria-hidden="true"><img src="../assets/team/haziq.webp" alt=""></div>
  <div><p class="eyebrow">Chief Editor and Designer</p><h3 style="margin-top:8px">Dr Haziq Aziz Shamri</h3><p class="role">Ophthalmology Resident, Brunei Eye Centre, Ministry of Health</p><div class="chips"><span class="chip">MBChB</span><span class="chip">Chief Editor and Designer, MataKitani</span><span class="chip">Founder and First President, BMSA</span></div></div>
</section></div></body></html>
