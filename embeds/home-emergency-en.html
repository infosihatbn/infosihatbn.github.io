<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergency</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700;800&display=swap"><style>
/* InfoSihat embed: brand blue + teal from the logo, Lexend display, Atkinson Hyperlegible body (built for low-vision readers) */
:root{
  --ink:#1F2A30; --muted:#4A5A62; --paper:#FFFFFF; --mist:#EEF6F9; --line:#D3E3EA;
  --blue:#4DA3CA; --blue-deep:#1F6E93; --teal:#4FBAB9; --teal-deep:#1C7675;
  --sun:#F4C04E; --sun-soft:#FFF4D6; --alert:#B3261E; --alert-soft:#FDECEA;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:400 18px/1.55 var(--body)}
h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
.wrap{padding:8px 4px 12px}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.em{display:flex;gap:20px;align-items:center;background:var(--alert-soft);border:2px solid var(--alert);border-radius:22px;padding:20px 24px}
.num{flex:none;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--alert);color:#fff;font:800 30px/1 var(--display);letter-spacing:.02em}
.num{position:relative;overflow:hidden}
.num .t{animation:numt 6s infinite}
.num svg{position:absolute;inset:0;margin:auto;width:78%;height:auto;opacity:0;animation:numt 6s infinite reverse}
.num svg path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:ecg 6s infinite}
@keyframes numt{0%,44%{opacity:1;transform:scale(1)}50%,94%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes ecg{0%,50%{stroke-dashoffset:200}72%,94%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.num .t,.num svg,.num svg path{animation:none}}
.em h3{font-size:22px;color:var(--alert)}
.em p{margin-top:6px}
.em ul{margin:10px 0 0;padding-left:22px;display:grid;gap:4px}
@media (max-width:520px){.em{flex-direction:column;align-items:flex-start}.num{width:76px;height:76px;font-size:24px}}
</style></head><body><div class="wrap">
<section class="em" aria-label="Emergency">
  <div class="num" aria-hidden="true"><span class="t">991</span><svg viewBox="0 0 100 60"><path d="M2 34H28L32 29L36 34H43L47 39L53 6L59 52L63 34H70Q75 25 80 34H98"/></svg></div>
  <div>
    <h3>Emergency? Call 991</h3>
    <p>For <b>any medical emergency</b>, call <b>991</b> for an ambulance, or go to the nearest hospital <b>Emergency Department</b> straight away.</p>
  </div>
</section></div></body></html>
