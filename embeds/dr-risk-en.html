<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Am I at risk? Quick check</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700;800&display=swap"><style>
/* MataKitani embed: brand blue + teal from the logo, Lexend display, Atkinson Hyperlegible body (built for low-vision readers) */
:root{
  --ink:#1B2B24; --muted:#55635B; --paper:#FFFFFF; --mist:#EEF4EC; --line:#DDE6DA;
  --blue:#5E9E7E; --blue-deep:#1F5A45; --teal:#EE9670; --teal-deep:#2D6A50;
  --sun:#F5A27C; --sun-soft:#FDEADF; --alert:#B3261E; --alert-soft:#FDECEA;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:400 18px/1.55 var(--body)}
h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
.wrap{padding:8px 4px 12px}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.rk{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:26px;display:grid;gap:16px}
.rk h2{font-size:24px}
.rk .sub{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:16px;cursor:pointer;background:var(--paper);transition:border-color .15s,background .15s}
.opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue-deep);flex:none}
.opt:has(input:checked){border-color:var(--blue-deep);background:var(--mist)}
.res{border-radius:18px;padding:16px 18px;background:var(--sun-soft);display:grid;gap:4px}
.res strong{font:700 19px/1.3 var(--display)}
.res.hi{background:var(--mist);border-left:6px solid var(--blue-deep)}
.note{font-size:14px;color:var(--muted)}
</style><style>@media screen{html[data-theme=dark]{--ink:#E8EFEA;--muted:#AFC0B5;--paper:#17211C;--mist:#1F2E27;--line:#31453A;--blue-deep:#9FD6B8;--teal-deep:#F5B496;--sun-soft:#3A2A20;--alert-soft:#3B1D1B;--cream:#121A16;color-scheme:dark}html[data-theme=dark] .brand img{border-radius:50%}html[data-theme=dark] .accb,html[data-theme=dark] .music-btn{color:#CFE9DA!important;background:#24332B!important}html[data-theme=dark] .music-btn[aria-pressed="true"]{background:#2E6B53!important;color:#fff!important}html[data-theme=dark] .wa-share{background:#167C40!important}html[data-theme=dark] .band svg.leaves{opacity:.22}html[data-theme=dark] .search{background:linear-gradient(135deg,#1F4A3A,#24533F 60%,#2D4B45)!important}html[data-theme=dark] .dot,html[data-theme=dark] .key .dot{color:#1B120D!important}html[data-theme=dark] h3{--alert:#FF9C8F}html[data-theme=dark] button.act,html[data-theme=dark] body .act{color:#2A140A!important}html[data-theme=dark] .opt:has(input:checked){border-color:#1F5A45!important}}</style><script>(()=>{const a=()=>{try{const t=localStorage.getItem('is-theme');document.documentElement.dataset.theme=t||'light'}catch(e){}};a();addEventListener('storage',a);setInterval(a,1500)})()</script></head><body><div class="wrap">
<section class="rk" aria-label="Am I at risk? Quick check">
  <div><h2>Am I at risk? Quick check</h2><p class="sub">Tick everything that applies to you.</p></div>
  <div class="opts"><label class="opt" for="o0"><input type="checkbox" id="o0"><span>I have diabetes</span></label><label class="opt" for="o1"><input type="checkbox" id="o1"><span>I have had diabetes for more than 10 years</span></label><label class="opt" for="o2"><input type="checkbox" id="o2"><span>My HbA1c is often above 9%</span></label><label class="opt" for="o3"><input type="checkbox" id="o3"><span>I have high blood pressure</span></label><label class="opt" for="o4"><input type="checkbox" id="o4"><span>I have high cholesterol</span></label><label class="opt" for="o5"><input type="checkbox" id="o5"><span>I have protein in my urine or kidney problems</span></label><label class="opt" for="o6"><input type="checkbox" id="o6"><span>I am pregnant, or planning pregnancy</span></label><label class="opt" for="o7"><input type="checkbox" id="o7"><span>I smoke</span></label></div>
  <div class="res" id="res" role="status" aria-live="polite"><strong id="rt"></strong><p id="rd"></p></div>
  <p class="note">This is not a diagnosis. Only an eye examination can tell if you have diabetic retinopathy.</p>
</section></div><script>
const M={"none": ["Tick the boxes that apply to you.", "If you have diabetes, you need an eye screening every year, even if you see well."], "nodm": ["You ticked {n}.", "Diabetic retinopathy only affects people with diabetes. If you have not been tested for diabetes, ask your doctor, especially if these risks apply to you."], "dm": ["You ticked {n} of 8.", "You have diabetes, so you need an eye screening every year. Each extra tick raises your risk, so ask your doctor or nurse when your next eye screening is due."], "dmhi": ["You ticked {n} of 8. Your risk is higher.", "Please make sure you have had an eye screening in the last 12 months. Ask your doctor about controlling your sugar, blood pressure and cholesterol."]};const box=[...document.querySelectorAll('input')];const t=document.getElementById('rt'),d=document.getElementById('rd'),r=document.getElementById('res');
function upd(){const n=box.filter(b=>b.checked).length,dm=box[0].checked;let k=n===0?'none':!dm?'nodm':n>=4?'dmhi':'dm';
t.textContent=M[k][0].replace('{n}',n);d.textContent=M[k][1];r.classList.toggle('hi',k==='dmhi');}
box.forEach(b=>b.addEventListener('change',upd));upd();</script></body></html>
