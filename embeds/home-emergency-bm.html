<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kecemasan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700;800&display=swap"><style>
/* MataKitani embed: brand blue + teal from the logo, Lexend display, Atkinson Hyperlegible body (built for low-vision readers) */
:root{
  --ink:#1B2B24; --muted:#55635B; --paper:#FFFFFF; --mist:#EEF4EC; --line:#DDE6DA;
  --blue:#4A8A5C; --blue-deep:#154A32; --teal:#EAB92A; --teal-deep:#256B43;
  --sun:#F2C230; --sun-soft:#FFF4CC; --alert:#B3261E; --alert-soft:#FDECEA;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:400 18px/1.55 var(--body)}
h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
.wrap{padding:8px 4px 12px}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.em{display:flex;gap:20px;align-items:center;background:var(--alert-soft);border:2px solid var(--alert);border-radius:22px;padding:20px 24px}
.num{flex:none;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--alert);color:#fff;font:800 30px/1 var(--display);letter-spacing:.02em}
.num{position:relative;overflow:hidden}
.num .t{animation:numt 6s infinite}
.num svg{position:absolute;inset:0;margin:auto;width:78%;height:auto;opacity:0;animation:ecgo 6s infinite}
.num svg path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:ecg 6s infinite}
@keyframes numt{0%,40%{opacity:1;transform:scale(1)}46%,94%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes ecgo{0%,48%{opacity:0}52%,84%{opacity:1}89%,100%{opacity:0}}
@keyframes ecg{0%,50%{stroke-dashoffset:200}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.num .t,.num svg,.num svg path{animation:none}}
.em h3{font-size:22px;color:var(--alert)}
.em p{margin-top:6px}
.em ul{margin:10px 0 0;padding-left:22px;display:grid;gap:4px}
@media (max-width:520px){.em{flex-direction:column;align-items:flex-start}.num{width:76px;height:76px;font-size:24px}}
</style><style>@media screen{html[data-theme=dark]{--ink:#E8EFEA;--muted:#AFC0B5;--paper:#17211C;--mist:#1F2E27;--line:#31453A;--blue-deep:#9FD6B8;--teal-deep:#F5B496;--sun-soft:#3A2A20;--alert-soft:#3B1D1B;--cream:#121A16;color-scheme:dark}html[data-theme=dark] .brand img{border-radius:50%}html[data-theme=dark] .accb,html[data-theme=dark] .music-btn{color:#CFE9DA!important;background:#24332B!important}html[data-theme=dark] .music-btn[aria-pressed="true"]{background:#2E6B53!important;color:#fff!important}html[data-theme=dark] .wa-share{background:#167C40!important}html[data-theme=dark] .band svg.leaves{opacity:.22}html[data-theme=dark] .search{background:linear-gradient(135deg,#1F4A3A,#24533F 60%,#2D4B45)!important}html[data-theme=dark] body .dot.dot,html[data-theme=dark] body .key .dot.dot{color:#1B120D!important}html[data-theme=dark] h3{--alert:#FF9C8F}html[data-theme=dark] button.act,html[data-theme=dark] body .act{color:#2A140A!important}}</style><script>(()=>{const a=()=>{try{const t=localStorage.getItem('is-theme');document.documentElement.dataset.theme=t||'light'}catch(e){}};a();addEventListener('storage',a);setInterval(a,1500)})()</script></head><body><div class="wrap">
<section class="em" aria-label="Kecemasan">
  <div class="num" aria-hidden="true"><span class="t">991</span><svg viewBox="0 0 100 60"><path d="M2 34H28L32 29L36 34H43L47 39L53 6L59 52L63 34H70Q75 25 80 34H98"/></svg></div>
  <div>
    <h3>Kecemasan?</h3>
    <p>Untuk <b>masalah mata yang mustahak lepas waktu pejabat</b>, pergi ke <b>Unit Kecemasan</b> hospital yang paling dekat. Untuk <b>kecemasan perubatan lain</b>, telefon <b>991</b> atau pergi ke Unit Kecemasan.</p>
  </div>
</section></div></body></html>
