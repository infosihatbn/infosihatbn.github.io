<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tinggi kah risiko ku? Semak cepat</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700;800&display=swap"><style>
/* InfoSihat embed: brand blue + teal from the logo, Lexend display, Atkinson Hyperlegible body (built for low-vision readers) */
:root{
  --ink:#1F2A30; --muted:#4A5A62; --paper:#FFFFFF; --mist:#EEF6F9; --line:#D3E3EA;
  --blue:#4DA3CA; --blue-deep:#1F6E93; --teal:#4FBAB9; --teal-deep:#1C7675;
  --sun:#F4C04E; --sun-soft:#FFF4D6; --alert:#B3261E; --alert-soft:#FDECEA;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:400 18px/1.55 var(--body)}
h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
.wrap{padding:8px 4px 12px}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.rk{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:26px;display:grid;gap:16px}
.rk h2{font-size:24px}
.rk .sub{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:16px;cursor:pointer;background:var(--paper);transition:border-color .15s,background .15s}
.opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue-deep);flex:none}
.opt:has(input:checked){border-color:var(--blue-deep);background:var(--mist)}
.res{border-radius:18px;padding:16px 18px;background:var(--sun-soft);display:grid;gap:4px}
.res strong{font:700 19px/1.3 var(--display)}
.res.hi{background:var(--mist);border-left:6px solid var(--blue-deep)}
.note{font-size:14px;color:var(--muted)}
</style></head><body><div class="wrap">
<section class="rk" aria-label="Tinggi kah risiko ku? Semak cepat">
  <div><h2>Tinggi kah risiko ku? Semak cepat</h2><p class="sub">Tanda samua yang berkenaan dengan kamu.</p></div>
  <div class="opts"><label class="opt" for="o0"><input type="checkbox" id="o0"><span>Umur ku lebih 40 tahun</span></label><label class="opt" for="o1"><input type="checkbox" id="o1"><span>Mak, bapa atau adik-beradik ku ada glaukoma</span></label><label class="opt" for="o2"><input type="checkbox" id="o2"><span>Doktor pernah cakap tekanan mata ku tinggi</span></label><label class="opt" for="o3"><input type="checkbox" id="o3"><span>Mata ku rabun jauh atau rabun dekat yang teruk</span></label><label class="opt" for="o4"><input type="checkbox" id="o4"><span>Aku ada kencing manis</span></label><label class="opt" for="o5"><input type="checkbox" id="o5"><span>Aku sudah lama pakai ubat steroid</span></label><label class="opt" for="o6"><input type="checkbox" id="o6"><span>Mata ku pernah cedera atau pernah dioperasi</span></label></div>
  <div class="res" id="res" role="status" aria-live="polite"><strong id="rt"></strong><p id="rd"></p></div>
  <p class="note">Ani bukan diagnosis. Ganya pemeriksaan mata yang dapat memastikan sama ada kamu ada glaukoma.</p>
</section></div><script>
const M={"none": ["Tanda kotak yang berkenaan dengan kamu.", "Kebanyakan urang yang ada glaukoma peringkat awal inda rasa apa-apa. Periksa mata ganya cara untuk tau."], "lo": ["Kamu menanda {n} daripada 7.", "Risiko kamu meningkat. Tanya doktor atau optometris pasal memeriksa tekanan mata dan saraf mata kamu."], "hi": ["Kamu menanda {n} daripada 7. Risiko kamu lebih tinggi.", "Buat temujanji periksa mata, dan minta tekanan mata dan saraf mata kamu diperiksa. Mun glaukoma ada dalam keluarga, beritahu keluarga kamu jua."]};const box=[...document.querySelectorAll('input')];const t=document.getElementById('rt'),d=document.getElementById('rd'),r=document.getElementById('res');
function upd(){const n=box.filter(b=>b.checked).length;let k=n===0?'none':n>=3?'hi':'lo';
t.textContent=M[k][0].replace('{n}',n);d.textContent=M[k][1];r.classList.toggle('hi',k==='hi');}
box.forEach(b=>b.addEventListener('change',upd));upd();</script></body></html>
