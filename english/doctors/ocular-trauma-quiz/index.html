<style>
/* Layout: friendly classroom quiz. Pale sky ground, navy ink, teal + sunshine yellow from the slide deck; one focused card at a time. */
:root{
  --bg:#eaf6f9;
  --bg2:#d7eef3;
  --surface:#ffffff;
  --ink:#123e63;
  --muted:#4b6a82;
  --line:#c9e1e8;
  --teal:#159fb2;
  --teal-ink:#0d7383;
  --sun:#ffc531;
  --sun-ink:#5a4100;
  --good:#23945c;
  --good-bg:#e3f6ec;
  --bad:#d6463d;
  --bad-bg:#fdeceb;
  --eye-white:#ffffff;
  --iris:#2a8fd6;
  --shadow:0 2px 0 rgba(18,62,99,.08),0 10px 30px -12px rgba(18,62,99,.25);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(circle at 12% -10%,var(--bg2) 0,transparent 45%),radial-gradient(circle at 100% 30%,var(--bg2) 0,transparent 35%);
  background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--ink)}
.brand svg{width:38px;height:38px}
.back{white-space:nowrap;font-weight:800;font-size:.95rem;color:var(--teal-ink);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.back:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill b{color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding-block:18px 8px}
.hero h1{font-size:clamp(2.4rem,7vw,3.8rem);font-weight:800;letter-spacing:-.01em}
.hero h1 .hl{background:var(--sun);color:var(--sun-ink);padding:0 .25em;border-radius:12px;display:inline-block;transform:rotate(-2deg)}
.hero p{max-width:34em;color:var(--muted);margin:14px 0 0;font-size:1.05rem}
.mascot{width:150px;height:150px;flex:none}
.mascot.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}

.byline{display:inline-flex;align-items:center;gap:14px;margin-top:18px;background:var(--surface);border-radius:999px;padding:8px 22px 8px 8px;box-shadow:var(--shadow)}
.byline img{width:68px;height:68px;border-radius:50%;flex:none}
.byline span{display:block;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.byline strong{display:block;font-family:var(--f-display);font-size:1.15rem;line-height:1.15;color:var(--ink)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 30px}
.how div{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.how strong{display:block;font-family:var(--f-display);font-size:1.1rem;line-height:1.2}
.how span{color:var(--muted);font-size:.92rem}
.how i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:.9rem;margin-bottom:6px}

.label{text-transform:uppercase;letter-spacing:.09em;font-weight:800;font-size:.78rem;color:var(--teal-ink)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:1.7rem}

/* diamond: 3 columns, half-height rows so tiles interlock 1 / 2-3 / 4 / 5-6 / 7 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,120px));grid-auto-rows:68px;gap:10px 14px;justify-content:center}
.grid .card{grid-row:span 2;align-content:center}
.grid .card:nth-child(1){grid-column:2;grid-row:1/span 2}
.grid .card:nth-child(2){grid-column:1;grid-row:2/span 2}
.grid .card:nth-child(3){grid-column:3;grid-row:2/span 2}
.grid .card:nth-child(4){grid-column:2;grid-row:3/span 2}
.grid .card:nth-child(5){grid-column:1;grid-row:4/span 2}
.grid .card:nth-child(6){grid-column:3;grid-row:4/span 2}
.grid .card:nth-child(7){grid-column:2;grid-row:5/span 2}
.card .nick{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.15;text-align:center;color:var(--ink);margin-top:10px;text-wrap:balance}
.qtop .nick{font-family:var(--f-body);font-size:.8rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-ink);display:block;line-height:1.2}
.card{background:color-mix(in srgb,var(--c,var(--teal)) 13%,var(--surface));border:2px solid color-mix(in srgb,var(--c,var(--teal)) 35%,transparent);border-radius:var(--r);padding:18px 10px 16px;box-shadow:var(--shadow);display:grid;justify-items:center;align-content:start;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c,var(--teal))}
.card .num,.card:hover .num{width:64px;height:64px;font-size:2.2rem;border-radius:18px;background:var(--c);color:var(--c-ink,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000)}
.qtop .num{background:var(--c,var(--teal))!important;color:var(--c-ink,#fff)!important}
.num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;background:var(--bg2);color:var(--teal-ink)}
.card:hover .num{background:var(--teal);color:#fff}

.foot{margin-top:32px;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center}
.foot p{margin:0;max-width:52em}
.link{background:none;border:0;padding:0;color:var(--teal-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.qtop .title{display:flex;align-items:center;gap:12px;min-width:0}
.qtop .num{width:42px;height:42px;font-size:1.35rem;background:var(--teal);color:#fff}
.qtop h2{font-size:1.5rem}
.dots{display:flex;gap:6px;align-items:center}
.dot{min-width:30px;height:30px;padding:0 8px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.dot.now{border-color:var(--teal);color:var(--teal-ink)}
.dot.ok{background:var(--good);border-color:var(--good);color:#fff}
.dot.no{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.bonus{border-style:dashed}

.qcard{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:clamp(18px,4vw,32px);position:relative}
.qcard .tag{display:inline-block;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:700;padding:3px 14px;border-radius:999px;font-size:.95rem}
.qcard .tag.bonus{background:var(--sun);color:var(--sun-ink)}
.qcard .tag.retry{background:var(--teal);color:#fff}
.qcard h3{font-size:clamp(1.35rem,3.6vw,1.75rem);font-weight:700;margin:12px 0 18px}
/* answer cards: big coloured game-show tiles, each with its own shape */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{--oc:var(--teal);--sh:color-mix(in srgb,var(--oc) 65%,#000);position:relative;display:flex;align-items:center;gap:18px;min-height:clamp(120px,24vh,240px);width:100%;text-align:left;background:var(--oc);color:#fff;border:0;border-radius:20px;padding:20px 24px;font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,2.6vw,2.1rem);line-height:1.15;box-shadow:0 7px 0 var(--sh);transition:transform .12s,box-shadow .12s,opacity .2s,filter .2s}
.opt.c0{--oc:#e5484d}.opt.c1{--oc:#1d82d0}.opt.c2{--oc:#7c4dc9}.opt.c3{--oc:#1f9d6b}
.opt:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 11px 0 var(--sh)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}
.opt:disabled{cursor:default}
.opt .k{width:clamp(40px,4.5vw,60px);height:clamp(40px,4.5vw,60px);flex:none}
.opt .k svg{width:100%;height:100%;display:block}
.opt .t{min-width:0;text-wrap:balance}
.opt.ok{outline:6px solid var(--good);outline-offset:4px}
.opt.no{filter:saturate(.35) brightness(.9)}
.opt.dim{opacity:.35;filter:grayscale(.7)}
.opt .mark{position:absolute;top:12px;right:12px;background:#fff;border-radius:999px;padding:4px 12px;font-family:var(--f-body);font-weight:800;font-size:.9rem}
.opt.ok .mark{color:var(--good)}
.opt.no .mark{color:var(--bad)}
/* bigger play view */
.playing .wrap{max-width:1240px}
.playing .qcard h3{font-size:clamp(1.6rem,4.2vw,3.1rem);line-height:1.15;margin:16px 0 24px}
.playing .fb p{font-size:clamp(1rem,1.6vw,1.25rem)}
.timer{display:flex;align-items:center;gap:12px;margin:-8px 0 20px}
.tbar{flex:1;height:14px;border-radius:999px;background:var(--bg2);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;border-radius:inherit;background:var(--good);transform-origin:left;transition:background-color .3s}
.timer.warn .tbar i{background:var(--sun)}
.timer.hurry .tbar i{background:var(--bad)}
.tnum{flex:none;min-width:3.2em;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:2px 10px}
.qcard.warn{animation:jitter-s 1.4s ease-in-out infinite}
.qcard.hurry{animation:jitter-l .7s ease-in-out infinite}
.timer.stop .tbar i{opacity:.45}
/* short bursts with a rest in between, so the answers stay easy to tap */
@keyframes jitter-s{0%,40%,100%{transform:none}8%{transform:translateX(-4px) rotate(-.4deg)}16%{transform:translateX(4px) rotate(.4deg)}24%{transform:translateX(-3px)}32%{transform:translateX(2px)}}
@keyframes jitter-l{0%,60%,100%{transform:none}10%{transform:translateX(-9px) rotate(-1deg)}20%{transform:translateX(9px) rotate(1deg)}30%{transform:translateX(-7px) rotate(-.6deg)}40%{transform:translateX(6px) rotate(.6deg)}50%{transform:translateX(-3px)}}
@media (max-width:620px){.opts{gap:10px}.opt{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:max(150px,25vh);padding:16px;font-size:1.2rem;border-radius:16px}.opt .k{width:32px;height:32px}.opt .mark{top:8px;right:8px;font-size:.72rem;padding:2px 8px}}

.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pop{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.03)}}

.fb{margin-top:18px;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;animation:rise .3s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.3}}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb svg{width:56px;height:56px;grid-row:span 2}
.fb strong{font-family:var(--f-display);font-size:1.35rem;line-height:1.2}
.fb.ok strong{color:var(--good)}
.fb.no strong{color:var(--bad)}
.fb p{margin:0;min-width:0}
.fb .why{font-weight:800}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:14px;padding:12px 22px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-ink);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 #d39a00}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}

/* interstitial / results */
.panel{text-align:center;display:grid;justify-items:center;gap:10px;padding-block:8px}
.panel .mascot{width:140px;height:140px}
.panel h2{font-size:clamp(1.9rem,5vw,2.6rem)}
.panel p{margin:0;max-width:32em;color:var(--muted)}
.bigscore{display:grid;justify-items:center;gap:2px;margin-block:4px}
.bigscore small{font-size:.8rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bigscore b{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,9vw,4.6rem);line-height:1;color:var(--teal-ink);font-variant-numeric:tabular-nums}
.bigscore em{font-style:normal;font-weight:800;font-size:.95rem;color:var(--muted)}
.btn .count{display:inline-block;min-width:1.6em;margin-left:6px;background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.score{font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:var(--bg);border-radius:999px;padding:4px 16px;font-variant-numeric:tabular-nums}
.panel .actions{justify-content:center}
.recap{width:100%;text-align:left;display:grid;gap:8px;margin-top:8px}
.recap div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.95rem}
.recap i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.recap .y{background:var(--good)} .recap .n{background:var(--bad)}
.recap span{min-width:0}

/* animated background */
.wrap{position:relative;z-index:1}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wave{position:absolute;left:0;bottom:0;width:200%;display:block;animation:drift linear infinite}
.wave path{fill:var(--teal)}
.w1{height:150px;opacity:.10;animation-duration:22s}
.w2{height:115px;opacity:.13;animation-duration:15s;animation-direction:reverse}
.w3{height:80px;opacity:.16;animation-duration:10s}
.wtop{top:0;bottom:auto;height:90px;opacity:.07;transform:scaleY(-1);animation:drift-top 26s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes drift-top{from{transform:scaleY(-1) translateX(-50%)}to{transform:scaleY(-1) translateX(0)}}
.bub{position:absolute;bottom:-40px;border-radius:50%;border:2px solid var(--teal);opacity:0;animation:rise-bub linear infinite}
@keyframes rise-bub{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.35}50%{transform:translateY(-50vh) translateX(18px)}90%{opacity:.25}100%{transform:translateY(-105vh) translateX(-10px);opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:620px){
  .hero{grid-template-columns:1fr}
  .hero .mascot{display:none}
  .how{grid-template-columns:1fr}
  .how div{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center}
  .how i{grid-row:span 2;margin:0}
  .fb{grid-template-columns:1fr}
  .fb svg{display:none}
  .actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ---------- Content ---------- */
const SECTIONS = [
{ id:"eyes", title:"Know Your Eyes", blurb:"The parts of the eye and how they protect themselves.",
  sets:[
  [
    {q:"Which part of the eye senses light and images?",o:["Cornea","Lens","Retina","Iris"],a:2,
     e:"The retina is the light-sensitive layer at the back of the eye. It turns light into signals and sends them to the brain through the optic nerve."},
    {q:"What is the clear, dome-shaped “window” at the front of the eye?",o:["Retina","Cornea","Pupil","Eyelid"],a:1,
     e:"The cornea is the clear front window of the eye. It lets light in and helps focus it. It is packed with nerve endings, which is why even a tiny scratch hurts a lot."},
    {q:"Which of these helps protect the eye naturally?",o:["Eyelids and eyelashes","The bony eye socket","Tears","All of the above"],a:3,
     e:"Eyelids blink to shield the eye, lashes catch dust, tears wash away dirt, and the bony socket absorbs many knocks. They can’t stop fast or sharp objects, which is why protective eyewear matters."}
  ],[
    {q:"What is the coloured part of the eye called?",o:["Pupil","Iris","Sclera","Retina"],a:1,
     e:"The iris is the coloured ring. Its tiny muscles make the pupil bigger or smaller to control how much light gets in."},
    {q:"Which nerve carries messages from the eye to the brain?",o:["Optic nerve","Facial nerve","Spinal cord","Hearing nerve"],a:0,
     e:"The optic nerve is the cable between the eye and the brain. If it is damaged, the lost vision usually cannot be recovered."},
    {q:"What is the tough white outer wall of the eye called?",o:["Cornea","Iris","Sclera","Lens"],a:2,
     e:"The sclera is the white of the eye. It is strong, but a hard blow or a sharp object can tear it. That is an emergency called an open globe injury."}
  ]],
  bonus:[
    {q:"What does the lens inside the eye do?",o:["Gives the eye its colour","Focuses light onto the retina","Makes tears","Moves the eye around"],a:1,
     e:"The lens sits behind the iris and fine-tunes focus so a sharp image lands on the retina. A blow to the eye can damage the lens and cause a cataract."},
    {q:"Why does a small scratch on the cornea hurt so much?",o:["The cornea has lots of nerve endings","The cornea has lots of blood vessels","The cornea is very thick","It doesn’t really hurt"],a:0,
     e:"The cornea has one of the highest numbers of nerve endings in the body. A small scratch (a corneal abrasion) can feel like something big is stuck in the eye."}
  ]},

{ id:"sports", title:"Sports & Play", blurb:"Balls, rackets and shuttlecocks move fast.",
  sets:[
  [
    {q:"Which of these can cause an eye injury during sports like tennis or pickleball?",o:["The ball","Another player’s racket","Accidental impact","All of the above"],a:3,
     e:"Eye injuries can happen from a fast-moving ball, a racket, or bumping into another player during sports."},
    {q:"What is the best eye protection for racket sports like badminton or squash?",o:["Sunglasses","Regular prescription glasses","Sports goggles with polycarbonate lenses","No protection needed"],a:2,
     e:"Sports goggles with polycarbonate lenses are built to take a hard hit. Ordinary glasses and sunglasses can shatter and make an injury worse."},
    {q:"A shuttlecock hits your friend’s eye. Their vision is blurry and you see blood in the front of the eye. What should they do?",o:["Keep playing if it doesn’t hurt much","Stop and see an eye doctor urgently","Rub the eye gently","Use eye drops and wait a week"],a:1,
     e:"Blood in the front of the eye (a hyphema) and blurry vision after a hit are warning signs. Stop playing, don’t rub, keep the head raised and get the eye checked the same day."}
  ],[
    {q:"Are ordinary prescription glasses enough protection during sports?",o:["Yes, they cover the eyes","No, they can break and cut the eye","Only for adults","Only if they are tinted"],a:1,
     e:"Everyday lenses and frames aren’t made for impact. Wear sports goggles, which can also be made with your prescription."},
    {q:"Which of these sports can cause eye injuries?",o:["Badminton","Basketball","Football","All of the above"],a:3,
     e:"Fast shuttlecocks and balls, and fingers and elbows in contact sports, are all common causes of sports eye injuries."},
    {q:"Why are polycarbonate lenses recommended for sports eyewear?",o:["They are very impact-resistant","They are cheaper","They change colour in sunlight","They help you see further"],a:0,
     e:"Polycarbonate is a tough, shatter-resistant plastic, much stronger than glass or regular plastic lenses."}
  ]],
  bonus:[
    {q:"After a hit to the eye during a game, everything seems fine. What is the safest choice?",o:["Go straight back to playing","Rest, and see a doctor if vision changes or pain gets worse","Rub the eye to check it","Ignore it completely"],a:1,
     e:"Some injuries, like a retinal tear, can show up hours or days later. See an eye doctor if you notice blurriness, new floaters, flashes, or pain that won’t settle."},
    {q:"Who especially needs eye protection in sports?",o:["Children","People with good vision in only one eye","Anyone playing fast ball or racket sports","All of the above"],a:3,
     e:"Everyone benefits. Children and people who rely on one good eye have the most to lose from an injury."}
  ]},

{ id:"chemical", title:"Chemical Splashes", blurb:"What to do when cleaners or chemicals get in the eye.",
  sets:[
  [
    {q:"What should you do if a chemical (like a cleaning agent) splashes into your eye?",o:["Rub the eye","Rinse immediately with plenty of clean water","Wait and see if it gets better","Use eye drops at home"],a:1,
     e:"Rinse straight away, before going to the doctor. For chemical injuries, every second counts."},
    {q:"How long should you rinse the eye after a chemical splash?",o:["About 10 seconds","About 1 minute","At least 20 minutes","Until the stinging stops"],a:2,
     e:"Rinse with clean running water for at least 20 minutes, even if it starts to feel better, then get medical help."},
    {q:"Which household product can cause one of the most serious eye burns?",o:["Drain or oven cleaner","Clean tap water","Baby shampoo","Saline solution"],a:0,
     e:"Strong alkalis such as drain cleaner, oven cleaner, cement and lime soak deep into the eye and can cause severe damage. Acids like toilet cleaner and battery acid are dangerous too."}
  ],[
    {q:"When rinsing a splashed eye, what should you do with the eyelids?",o:["Keep them shut tightly","Hold them open so water reaches the whole eye","Press on them firmly","Cover them with a cloth"],a:1,
     e:"Gently hold the lids apart and move the eye around so the water washes every part of it."},
    {q:"Someone wearing contact lenses gets a chemical splash. What comes first?",o:["Go home and remove the lenses there","Start rinsing right away, and take lenses out if they come out easily","Leave the lenses in to protect the eye","Put in a fresh pair of lenses"],a:1,
     e:"Rinsing must never be delayed. Lenses can trap chemicals, so remove them during rinsing if you can do it easily."},
    {q:"Should you use vinegar or baking soda to “cancel out” a chemical in the eye?",o:["Yes, it neutralises the chemical","Only for acids","No, use clean water only","Only for children"],a:2,
     e:"Never add other chemicals. The reaction can make heat and cause more damage. Plenty of clean water is the right first aid."}
  ]],
  bonus:[
    {q:"What should you take with you to the hospital after a chemical splash?",o:["The product bottle or its label","Nothing","Some eye drops","A photo of your eye"],a:0,
     e:"Knowing exactly what the chemical was helps doctors choose the right treatment."},
    {q:"Which is a good way to prevent chemical eye injuries at home?",o:["Wear safety goggles with strong cleaners","Store chemicals away from children","Point spray nozzles away from your face","All of the above"],a:3,
     e:"Simple habits prevent most splashes. Keep chemicals in their original labelled bottles too."}
  ]},

{ id:"warning", title:"Warning Signs", blurb:"Know when an eye problem needs urgent care.",
  sets:[
  [
    {q:"Which of these is a warning sign that you should seek urgent eye care?",o:["Sudden loss of vision","Flashes of light","A curtain or shadow in your vision","All of the above"],a:3,
     e:"Sudden vision loss, flashes, or a curtain or shadow across your vision can mean a retinal detachment. These need urgent eye care."},
    {q:"After a blow to the eye, you notice many new floaters and flashes of light. What could this mean?",o:["Normal tiredness","A torn or detached retina","Dry eyes","You need new glasses"],a:1,
     e:"New floaters and flashes after an injury can be a sign of a retinal tear. Quick treatment can save sight."},
    {q:"After being hit near the eye, a person sees double. What should they do?",o:["Sleep it off","Get medical care urgently","Wear sunglasses","Do eye exercises"],a:1,
     e:"Double vision after an injury can mean a broken bone around the eye (an orbital fracture) trapping an eye muscle. It needs urgent assessment."}
  ],[
    {q:"Which of these is usually NOT an emergency?",o:["Tired eyes after reading for a long time","Sudden loss of vision","An odd-shaped pupil after an injury","Severe eye pain after a hit"],a:0,
     e:"Tired eyes usually get better with rest. The other three need emergency care straight away."},
    {q:"After an injury, the pupil looks like a teardrop instead of a circle. What might this mean?",o:["Nothing serious","The eyeball may be cut or burst","It’s a normal reaction to light","The person is tired"],a:1,
     e:"An odd-shaped pupil after an injury can be a sign of an open globe injury. Don’t press on the eye. Cover it with a rigid shield and go to the emergency department."},
    {q:"You have a serious eye injury late at night. Where should you go?",o:["Wait for the clinic to open","The nearest hospital emergency department","A pharmacy","An optical shop"],a:1,
     e:"Serious eye injuries can’t wait. Go to the emergency department, or call an ambulance if you can’t get there safely."}
  ]],
  bonus:[
    {q:"A painless bright red patch appears on the white of the eye after a hard cough. Vision is normal. What is it most likely to be?",o:["A broken small blood vessel that usually clears in 1–2 weeks","A detached retina","A deep cut in the eye","An infection that spreads"],a:0,
     e:"This is a subconjunctival haemorrhage, like a bruise on the eye. It usually fades on its own. See a doctor if it follows an injury, keeps coming back, or comes with pain or vision changes."},
    {q:"Which symptom after an eye injury means you should see a doctor?",o:["Blurred vision","Pain that won’t go away","Pain when looking at light","All of the above"],a:3,
     e:"Any change in vision, ongoing pain or light sensitivity after an injury should be checked by a doctor."}
  ]},

{ id:"foreign", title:"Something in Your Eye", blurb:"Dust, sand, metal and stuck objects.",
  sets:[
  [
    {q:"Dust or sand blows into your eye. What should you do first?",o:["Rub it hard","Blink and rinse with clean water","Scrape it out with a cotton bud","Use tweezers"],a:1,
     e:"Rubbing can scratch the cornea. Blinking and rinsing with clean water or saline usually washes small specks out."},
    {q:"Something is stuck in the eye, like a piece of metal or wood. What should you do?",o:["Pull it out quickly","Leave it in, cover the eye with a shield and go to the emergency department","Press a pad firmly on the eye","Wash it with soap"],a:1,
     e:"Never remove an object stuck in the eye. Protect it with a rigid shield (the bottom of a paper cup works), avoid any pressure, and get emergency help."},
    {q:"Why shouldn’t you rub your eye when something is in it?",o:["It can scratch the cornea or push the object deeper","It makes the eye drier","It’s just bad manners","It changes your eye colour"],a:0,
     e:"Rubbing drags the speck across the cornea and can push sharp pieces further in."}
  ],[
    {q:"You were grinding metal without goggles and felt something hit your eye. Now it feels fine. What should you do?",o:["Nothing, it’s fine","See a doctor to get it checked","Wait a month","Rub it to check"],a:1,
     e:"Tiny high-speed metal pieces can enter the eye without much pain, then rust or cause infection. Get checked promptly, and always wear safety goggles when grinding."},
    {q:"How should you cover an eye that may have a cut or a stuck object?",o:["A tight bandage pressing on the eye","A rigid shield that doesn’t touch the eye","Cotton wool pressed into the eye","Leave it uncovered and rub it"],a:1,
     e:"Pressure can push the eye’s contents out through a wound. A rigid shield protects the eye without touching it."},
    {q:"An eyelash is stuck in your eye. What is a safe thing to try?",o:["Blink several times and rinse with clean water","Pick it out with something sharp","Rub hard","Ignore it for a week"],a:0,
     e:"Blinking and rinsing usually move an eyelash out. If it stays stuck or the eye stays painful, see a doctor."}
  ]],
  bonus:[
    {q:"Which is a common sign of a scratched cornea?",o:["Pain and watering","Feeling like something is in the eye","Sensitivity to light","All of the above"],a:3,
     e:"A corneal scratch often causes pain, tears, light sensitivity and a gritty feeling. It usually heals well with treatment, so see a doctor."},
    {q:"After rinsing, a speck is still stuck on the coloured part of the eye. What now?",o:["Wipe it off with a tissue","See a doctor or eye specialist","Use tweezers carefully","Keep rubbing until it comes out"],a:1,
     e:"A speck that stays on the cornea needs to be removed safely by a professional with the right tools."}
  ]},

{ id:"home", title:"Home, DIY & Fireworks", blurb:"Cleaning, cooking, power tools and festivities.",
  sets:[
  [
    {q:"Where do almost half of all eye injuries happen?",o:["At home","At school","At the cinema","At the beach"],a:0,
     e:"Nearly half of eye injuries happen at home, during cleaning, cooking, DIY and gardening."},
    {q:"What should you wear when using power tools, a grass trimmer or a lawnmower?",o:["Nothing special","Safety glasses or goggles","Sunglasses","A cap"],a:1,
     e:"Safety glasses with side protection stop flying debris. People nearby should keep well back too."},
    {q:"About how many eye injuries could be prevented by wearing the right eye protection?",o:["About 10%","About 25%","About 50%","About 90%"],a:3,
     e:"Experts estimate around 90% of eye injuries could be prevented with proper protective eyewear."}
  ],[
    {q:"What is the safest way to enjoy fireworks?",o:["Light them while holding them","Watch a professional display from a safe distance","Let children hold sparklers alone","Look into a firework that didn’t go off"],a:1,
     e:"Fireworks cause serious eye injuries every year, often to people watching. Never relight a dud, and supervise children closely."},
    {q:"Someone’s eye is injured by a firework. What should you do?",o:["Rub it","Rinse it with strong pressure","Cover it with a shield without pressing and go to the emergency department","Put ointment on it"],a:2,
     e:"Don’t rub, press, or try to remove anything. Protect the eye with a shield and get emergency care right away."},
    {q:"What makes safety glasses different from ordinary glasses?",o:["They are tested to resist impact and often have side shields","They are just thicker","There is no difference","They are always tinted"],a:0,
     e:"Safety eyewear is tested for impact and usually wraps around or has side shields to block debris from the sides."}
  ]],
  bonus:[
    {q:"Is it safe to shine a laser pointer into someone’s eyes as a joke?",o:["Yes, it’s just light","Only for a second","No, it can permanently damage the retina","Only at night"],a:2,
     e:"Strong laser pointers can burn the retina in a fraction of a second. Never point one at anyone’s eyes."},
    {q:"Which cooking habit helps protect your eyes?",o:["Use a splatter screen and keep your face back from hot oil","Lean over the pan to check the food","Add water to hot oil","Cook without looking"],a:0,
     e:"Hot oil splashes can burn the eye and eyelids. Never add water to hot oil, as it can spit violently."}
  ]},

{ id:"kids", title:"Kids & School Safety", blurb:"For parents, teachers and students.",
  sets:[
  [
    {q:"Which type of toy is most risky for children’s eyes?",o:["Soft plush toys","Toys that shoot things, like darts, pellets or slingshots","Picture books","Rounded building blocks"],a:1,
     e:"Projectile toys such as pellet guns, dart guns and slingshots are a major cause of serious eye injuries in children."},
    {q:"A child is poked in the eye with a pencil and the eye is bleeding. What should you do?",o:["Pull out any piece left in the eye","Wash it with soap","Cover the eye with a shield without pressing and get emergency help","Tell them to rub it"],a:2,
     e:"Keep the child calm, don’t press on the eye or remove anything, cover it with a rigid shield and go to the emergency department."},
    {q:"In a school science lab, what should students wear when using chemicals?",o:["Safety goggles","Sunglasses","Nothing if they are careful","A face mask only"],a:0,
     e:"Lab goggles protect against splashes and flying glass. Teachers should also know where the eyewash station is."}
  ],[
    {q:"A child has a black eye after a fall. What helps?",o:["A wrapped cold pack around the eye, without pressing on the eyeball","Raw meat on the eye","Rubbing the bruise","A hot water bottle on the eye"],a:0,
     e:"A cool compress for 10–15 minutes at a time eases swelling. See a doctor if there is any vision change, double vision, blood in the eye, or severe pain."},
    {q:"Is putting raw steak on a black eye a good idea?",o:["Yes, it is the best treatment","No, it can carry germs and doesn’t help more than a cold pack","Only if it’s frozen","Only for adults"],a:1,
     e:"Raw meat can carry bacteria into an injured area. A clean, wrapped cold pack does the job better."},
    {q:"Which is the safest toy choice for a young child?",o:["A soft foam ball","A slingshot","A laser pointer","A toy with sharp pointed parts"],a:0,
     e:"Choose age-appropriate toys without sharp points or flying parts, and check toy labels for safety warnings."}
  ]],
  bonus:[
    {q:"A student gets hit in the eye during PE. What is a good first step?",o:["Tell them to carry on","Stop the activity, check their vision with the other eye covered, and get medical help if anything is wrong","Rub the eye for them","Give eye drops and send them back to class"],a:1,
     e:"Stop, check, and don’t press on the eye. Inform the parents, and get medical help for blurred vision, pain, blood in the eye or double vision."},
    {q:"A child gets sand in the eye at the playground. What should you do?",o:["Let them rub it out","Rinse the eye with clean water and stop them rubbing","Blow into the eye","Wipe the eye with a tissue corner"],a:1,
     e:"Rinsing gently washes sand away. Rubbing can scratch the cornea."}
  ]}
];

/* ---------- Mascot ---------- */
function mascot(mood, cls){
  const mouth = {
    happy:'<path d="M38 70 Q52 84 66 70" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>',
    wow:'<ellipse cx="52" cy="74" rx="7" ry="8" fill="var(--ink)"/>',
    sad:'<path d="M40 78 Q52 68 64 78" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>',
    think:'<path d="M42 74 L62 72" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>'
  }[mood||"happy"];
  const extra = mood==="wow" ? '<g stroke="var(--sun)" stroke-width="5" stroke-linecap="round"><path d="M8 18l8 8"/><path d="M50 2v10"/><path d="M92 18l-8 8"/></g>' :
                mood==="sad" ? '<path d="M84 52c4 6 6 10 3 13s-8 0-7-5c0-3 2-5 4-8z" fill="var(--iris)"/>' : '';
  return `<svg class="mascot ${cls||""}" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="52" cy="52" r="40" fill="var(--eye-white)" stroke="var(--ink)" stroke-width="5"/>
    <circle cx="52" cy="44" r="19" fill="var(--iris)"/>
    <circle cx="52" cy="44" r="9" fill="var(--ink)"/>
    <circle cx="58" cy="38" r="4.5" fill="#fff"/>
    ${mouth}${extra}</svg>`;
}

/* ---------- Randomising helpers ---------- */
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Shuffle answer options; keep "All of the above" as the last option.
// Shuffle all 4 options; "All of the above" stays last.
function prep(q){
  const idx=q.o.map((_,k)=>k);
  const allIdx=q.o.indexOf("All of the above");
  const order=allIdx>=0?shuffle(idx.filter(k=>k!==allIdx)).concat(allIdx):shuffle(idx);
  return {q:q.q,e:q.e,o:order.map(k=>q.o[k]),a:order.indexOf(q.a),src:q};
}

  const s=SECTIONS[sec];
  const all=s.sets.flat();
  let avail=all.filter(q=>!used.includes(q));
  if(avail.length<3){ avail=all; used=[]; }
  const picked=shuffle(avail).slice(0,3);
  S={sec,attempt,used:used.concat(picked),qs:picked.map(prep),
     bonusQ:prep(s.bonus[Math.floor(Math.random()*s.bonus.length)]),
     phase:"main",i:0,results:[],bonusResult:null};
  question();
}

function curQ(){ return S.phase==="bonus" ? S.bonusQ : S.qs[S.i]; }

function dotsHTML(){
  let h="";
  for(let k=0;k<3;k++){
    const r=S.results[k];
    const cls=r===true?"ok":r===false?"no":(S.phase==="main"&&k===S.i?"now":"");
    h+=`<span class="dot ${cls}">${r===true?"✓":r===false?"✗":k+1}</span>`;
  }
  if(S.phase==="bonus"){
    const r=S.bonusResult;
    h+=`<span class="dot bonus ${r===true?"ok":r===false?"no":"now"}">Bonus</span>`;
  }
  return h;
}

function topHTML(){
  return `<div class="qtop">
    <div class="title"><span class="num" style="${RAINBOW[S.sec]}">${S.sec+1}</span><div><span class="nick">Section ${S.sec+1}</span><h2>${NICK[S.sec]}</h2></div></div>
    <div class="dots" aria-label="Progress">${dotsHTML()}</div>
  </div>`;
}

function question(){
  document.body.classList.add("playing");
  const q=curQ();
  const tag = S.phase==="bonus" ? '<span class="tag bonus">Bonus question</span>'
            : `<span class="tag ${S.attempt>1?"retry":""}">Question ${S.i+1} of 3${S.attempt>1?" · Fresh set":""}</span>`;
  app.innerHTML=`${topHTML()}
  <div class="qcard" id="qcard">
    ${tag}
    <h3>${esc(q.q)}</h3>
    <div class="timer" id="timer" role="timer" aria-label="Time left"><div class="tbar"><i id="tfill"></i></div></div>
    <div class="opts" role="group" aria-label="Answers">
      ${q.o.map((t,k)=>`<button class="opt c${k}" data-k="${k}" aria-label="${["Circle","Triangle","Star","Square"][k]}: ${esc(t)}"><span class="k">${SHAPES[k]}</span><span class="t">${esc(t)}</span></button>`).join("")}
    </div>
    <div id="fb"></div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  startTimer();
  window.scrollTo({top:0});
}

/* ---------- 40-second timer ---------- */
const LIMIT=40; let tRAF=null;
function stopTimer(){ if(tRAF){cancelAnimationFrame(tRAF);tRAF=null} const t=document.getElementById("timer"); if(t) t.classList.add("stop"); const c=document.getElementById("qcard"); if(c) c.classList.remove("warn","hurry"); }
function startTimer(){
  if(tRAF) cancelAnimationFrame(tRAF);
  const t0=performance.now(), fill=document.getElementById("tfill"), box=document.getElementById("timer"), card=document.getElementById("qcard");
  const step=now=>{
    const left=Math.max(0,LIMIT-(now-t0)/1000);
    fill.style.transform=`scaleX(${left/LIMIT})`;
    box.classList.toggle("warn",left<=20&&left>10);
    box.classList.toggle("hurry",left<=10);
    card.classList.toggle("warn",left<=20&&left>10);
    card.classList.toggle("hurry",left<=10);
    if(left<=0){ tRAF=null; answer(-1); return; }
    tRAF=requestAnimationFrame(step);
  };
  tRAF=requestAnimationFrame(step);
}

function answer(k){
  if(!S || app.querySelector(".opt:disabled")) return;
  stopTimer();
  const q=curQ(), ok=k===q.a;
  const opts=[...app.querySelectorAll(".opt")];
  opts.forEach((b,j)=>{
    b.disabled=true;
    if(j===q.a){b.classList.add("ok");b.insertAdjacentHTML("beforeend",'<span class="mark">✓ Correct</span>')}
    else if(j===k){b.classList.add("no");b.insertAdjacentHTML("beforeend",'<span class="mark">✗ Your pick</span>')}
    else b.classList.add("dim");
  });
  if(S.phase==="bonus") S.bonusResult=ok; else S.results[S.i]=ok;
  app.querySelector(".dots").innerHTML=dotsHTML();
  const card=document.getElementById("qcard");
  if(ok){ card.classList.add("pop"); confetti(opts[k]); }
  else { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }

  const last = S.phase==="bonus" || S.i===2;
  const praise=["Correct!","Well done!","Spot on!","You got it!"][Math.floor(Math.random()*4)];
  document.getElementById("fb").innerHTML=`
    <div class="fb ${ok?"ok":"no"}">
      ${mascot(ok?"wow":"sad")}
      <strong>${ok?praise:k<0?"Time’s up!":"Not quite."}</strong>
      <p>${ok?"":`The answer is <b>${esc(q.o[q.a])}</b>. `}<span class="why">Why?</span> ${esc(q.e)}</p>
    </div>
    <div class="actions"><button class="btn" id="next">${last?"See my score":"Next question"} →${last?`<span class="count" id="count">${AUTO}</span>`:""}</button></div>`;
  const nx=document.getElementById("next"); nx.onclick=next; nx.focus({preventScroll:true});
  if(last){
    // Final question: go to the score page automatically after a short pause to read the explanation.
    let n=AUTO; autoT=setInterval(()=>{ n--; const c=document.getElementById("count"); if(c) c.textContent=n; if(n<=0) next(); },1000);
  }
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}

const AUTO=6; let autoT=null;
function next(){
  clearInterval(autoT); autoT=null;
  if(S.phase==="main" && S.i<2){ S.i++; question(); return; }
  results();
}

function recapHTML(){
  const qs=S.qs.slice(), rs=S.results.slice();
  if(S.phase==="bonus"){ qs.push(S.bonusQ); rs.push(S.bonusResult); }
  return `<div class="recap">${qs.map((q,k)=>`<div><i class="${rs[k]?"y":"n"}">${rs[k]?"✓":"✗"}</i><span>${esc(q.q)}<br><b>${esc(q.o[q.a])}</b></span></div>`).join("")}</div>`;
}

function scoreHTML(right){
  const b=S.phase==="bonus";
  return `<div class="bigscore"><small>Your score</small><b>${right} / 3</b>${b?`<em>Bonus question ${S.bonusResult?"✓ correct":"✗ missed"}</em>`:""}</div>`;
}
function results(){
  const right=S.results.filter(Boolean).length;
  const nextSec=(S.sec+1)%7;
  const moveOn=`<div class="actions">
        <button class="btn ghost" data-go="home">All sections</button>
        <button class="btn" data-go="next">Next: ${NICK[nextSec]} →</button>
      </div>`;
  let body;

  if(S.phase==="bonus"){
    body=`${mascot(S.bonusResult?"wow":"happy")}
      ${scoreHTML(right)}
      <h2>${NICK[S.sec]} complete!</h2>
      <p>${S.bonusResult?"Great finish. You nailed the bonus question.":"Thanks for sticking with it. Have a look at the answers below. They could help someone one day."}</p>
      ${recapHTML()}${moveOn}`;
    if(S.bonusResult) setTimeout(()=>bigConfetti(),150);
  } else if(right===3){
    body=`${mascot("wow","bob")}
      ${scoreHTML(right)}
      <h2>All 3 correct!</h2>
      <p>You know how to keep your eyes safe. Share what you learned with family and friends.</p>
      ${recapHTML()}${moveOn}`;
    setTimeout(()=>bigConfetti(),150);
  } else if(right>0){
    body=`${mascot("think")}
      ${scoreHTML(right)}
      <h2>Nearly there!</h2>
      <p>You got ${right} out of 3. Here’s one bonus question to round off this section.</p>
      <div class="actions"><button class="btn sun" data-go="bonus">Try the bonus question →</button></div>`;
  } else {
    body=`${mascot("sad")}
      ${scoreHTML(right)}
      <h2>Let’s try a fresh set</h2>
      <p>No worries, that’s how we learn. Here are 3 new questions on the same topic to try again.</p>
      ${recapHTML()}
      <div class="actions">
        <button class="btn ghost" data-go="home">All sections</button>
        <button class="btn" data-go="retry">Try a new set →</button>
      </div>`;
  }
  app.innerHTML=`${topHTML()}<div class="qcard panel">${body}</div>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==="home") home();
    else if(g==="next") start(nextSec,1,[]);
    else if(g==="bonus"){ S.phase="bonus"; question(); }
    else if(g==="retry") start(S.sec,S.attempt+1,S.used);
  });
  window.scrollTo({top:0});
}

/* ---------- Keyboard: A–D or 1–4 to answer, Enter for next ---------- */
document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey) return;
  const map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  const k=map[e.key.toLowerCase()];
  const opts=app.querySelectorAll(".opt:not(:disabled)");
  if(k!==undefined && opts.length===4){ opts[k].click(); }
});
document.getElementById("home-btn").onclick=home;

/* ---------- Confetti ---------- */
const cv=document.getElementById("confetti"), cx=cv.getContext("2d");
let parts=[], raf=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function colors(){const cs=getComputedStyle(document.documentElement);return ["--sun","--teal","--good","--iris","--bad"].map(v=>cs.getPropertyValue(v).trim()||"#ffc531")}
function burst(x,y,n,spread,power){
  if(reduce) return;
  const c=colors();
  for(let i=0;i<n;i++){
    const ang=-Math.PI/2+(Math.random()-.5)*spread, sp=power*(.5+Math.random());
    parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,g:.25+Math.random()*.15,s:5+Math.random()*6,
      r:Math.random()*6,vr:(Math.random()-.5)*.3,c:c[i%c.length],life:0,shape:Math.random()<.3?"c":"r"});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function confetti(el){
  const r=el.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,70,Math.PI*1.1,13);
}
function bigConfetti(){
  const w=innerWidth,h=innerHeight;
  burst(w*.2,h*.9,90,1.2,20); burst(w*.8,h*.9,90,1.2,20);
  setTimeout(()=>burst(w*.5,h*.8,80,1.6,18),250);
}
function tick(){
  const dpr=devicePixelRatio||1;
  if(cv.width!==innerWidth*dpr){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30&&p.life<260);
  for(const p of parts){
    p.life++; p.vx*=.985; p.vy=p.vy*.985+p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    if(p.shape==="c"){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()} else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2*Math.abs(Math.cos(p.life*.1+p.r))+1);
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}

home();
</script>

</body></html>
