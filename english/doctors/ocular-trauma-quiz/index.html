<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: friendly classroom quiz. Pale sky ground, navy ink, teal + sunshine yellow from the slide deck; one focused card at a time. */
:root{
  --bg:#eaf6f9;
  --bg2:#d7eef3;
  --surface:#ffffff;
  --ink:#123e63;
  --muted:#4b6a82;
  --line:#c9e1e8;
  --teal:#159fb2;
  --teal-ink:#0d7383;
  --sun:#ffc531;
  --sun-ink:#5a4100;
  --good:#23945c;
  --good-bg:#e3f6ec;
  --bad:#d6463d;
  --bad-bg:#fdeceb;
  --eye-white:#ffffff;
  --iris:#2a8fd6;
  --shadow:0 2px 0 rgba(18,62,99,.08),0 10px 30px -12px rgba(18,62,99,.25);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(circle at 12% -10%,var(--bg2) 0,transparent 45%),radial-gradient(circle at 100% 30%,var(--bg2) 0,transparent 35%);
  background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--ink)}
.brand svg{width:38px;height:38px}
.back{white-space:nowrap;font-weight:800;font-size:.95rem;color:var(--teal-ink);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.back:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill b{color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding-block:18px 8px}
.hero h1{font-size:clamp(2.4rem,7vw,3.8rem);font-weight:800;letter-spacing:-.01em}
.hero h1 .hl{background:var(--sun);color:var(--sun-ink);padding:0 .25em;border-radius:12px;display:inline-block;transform:rotate(-2deg)}
.hero p{max-width:34em;color:var(--muted);margin:14px 0 0;font-size:1.05rem}
.mascot{width:150px;height:150px;flex:none}
.mascot.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}

.byline{display:inline-flex;align-items:center;gap:14px;margin-top:18px;background:var(--surface);border-radius:999px;padding:8px 22px 8px 8px;box-shadow:var(--shadow)}
.byline img{width:68px;height:68px;border-radius:50%;flex:none}
.byline span{display:block;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.byline strong{display:block;font-family:var(--f-display);font-size:1.15rem;line-height:1.15;color:var(--ink)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 30px}
.how div{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.how strong{display:block;font-family:var(--f-display);font-size:1.1rem;line-height:1.2}
.how span{color:var(--muted);font-size:.92rem}
.how i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:.9rem;margin-bottom:6px}

/* homepage artwork */
.hero .art{width:min(320px,34vw);aspect-ratio:1;border-radius:28px;object-fit:cover;box-shadow:var(--shadow);transform:rotate(2deg);border:6px solid var(--surface)}
/* Children | Adults switch */
.mode{display:inline-flex;background:var(--surface);border-radius:999px;padding:5px;gap:4px;box-shadow:var(--shadow);margin:0 auto 18px}
.mode button{border:0;background:none;border-radius:999px;padding:10px 22px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;color:var(--muted)}
.mode button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.modewrap{display:flex;flex-direction:column;align-items:center}
.modewrap p{margin:-8px 0 16px;color:var(--muted);font-size:.95rem;text-align:center}
.label{text-transform:uppercase;letter-spacing:.09em;font-weight:800;font-size:.78rem;color:var(--teal-ink)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:1.7rem}

/* diamond: 1 on top, 2-3-4 across the middle, 5 at the bottom */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,120px));grid-auto-rows:150px;gap:12px 14px;justify-content:center}
.grid .card:nth-child(1){grid-column:2;grid-row:1}
.grid .card:nth-child(2){grid-column:1;grid-row:2}
.grid .card:nth-child(3){grid-column:2;grid-row:2}
.grid .card:nth-child(4){grid-column:3;grid-row:2}
.grid .card:nth-child(5){grid-column:2;grid-row:3}
/* tiles take turns wiggling: one every second, each repeats every 5 seconds */
.grid .card{animation:tile-wiggle 5s ease-in-out infinite}
.grid .card:nth-child(2){animation-delay:1s}
.grid .card:nth-child(3){animation-delay:2s}
.grid .card:nth-child(4){animation-delay:3s}
.grid .card:nth-child(5){animation-delay:4s}
.grid .card:hover,.grid .card:focus-visible{animation-play-state:paused}
@keyframes tile-wiggle{0%,16%,100%{transform:none}3%{transform:rotate(-7deg) scale(1.06)}6%{transform:rotate(6deg) scale(1.06)}9%{transform:rotate(-5deg) scale(1.04)}12%{transform:rotate(3deg)}14%{transform:rotate(-1deg)}}
.card .nick{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.15;text-align:center;color:var(--ink);margin-top:10px;text-wrap:balance}
.qtop .nick{font-family:var(--f-body);font-size:.8rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-ink);display:block;line-height:1.2}
.card{background:color-mix(in srgb,var(--c,var(--teal)) 13%,var(--surface));border:2px solid color-mix(in srgb,var(--c,var(--teal)) 35%,transparent);border-radius:var(--r);padding:18px 10px 16px;box-shadow:var(--shadow);display:grid;justify-items:center;align-content:start;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c,var(--teal))}
.card .num,.card:hover .num{width:64px;height:64px;font-size:2.2rem;border-radius:18px;background:var(--c);color:var(--c-ink,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000)}
.qtop .num{background:var(--c,var(--teal))!important;color:var(--c-ink,#fff)!important}
.num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;background:var(--bg2);color:var(--teal-ink)}
.card:hover .num{background:var(--teal);color:#fff}

.foot{margin-top:32px;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center}
.foot p{margin:0;max-width:52em}
.link{background:none;border:0;padding:0;color:var(--teal-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.qtop .title{display:flex;align-items:center;gap:12px;min-width:0}
.qtop .num{width:42px;height:42px;font-size:1.35rem;background:var(--teal);color:#fff}
.qtop h2{font-size:1.5rem}
.dots{display:flex;gap:6px;align-items:center}
.dot{min-width:30px;height:30px;padding:0 8px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.dot.now{border-color:var(--teal);color:var(--teal-ink)}
.dot.ok{background:var(--good);border-color:var(--good);color:#fff}
.dot.no{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.bonus{border-style:dashed}

.qcard{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:clamp(18px,4vw,32px);position:relative}
.qcard .tag{display:inline-block;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:700;padding:3px 14px;border-radius:999px;font-size:.95rem}
.qcard .tag.bonus{background:var(--sun);color:var(--sun-ink)}
.qcard .tag.retry{background:var(--teal);color:#fff}
.qcard h3{font-size:clamp(1.35rem,3.6vw,1.75rem);font-weight:700;margin:12px 0 18px}
/* answer cards: big coloured game-show tiles, each with its own shape */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{--oc:var(--teal);--sh:color-mix(in srgb,var(--oc) 65%,#000);position:relative;display:flex;align-items:center;gap:18px;min-height:clamp(120px,24vh,240px);width:100%;text-align:left;background:var(--oc);color:#fff;border:0;border-radius:20px;padding:20px 24px;font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,2.6vw,2.1rem);line-height:1.15;box-shadow:0 7px 0 var(--sh);transition:transform .12s,box-shadow .12s,opacity .2s,filter .2s}
.opt.c0{--oc:#e5484d}.opt.c1{--oc:#1d82d0}.opt.c2{--oc:#7c4dc9}.opt.c3{--oc:#1f9d6b}
.opt:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 11px 0 var(--sh)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}
.opt:disabled{cursor:default}
.opt .k{width:clamp(40px,4.5vw,60px);height:clamp(40px,4.5vw,60px);flex:none}
.opt .k svg{width:100%;height:100%;display:block}
.opt .t{min-width:0;text-wrap:balance}
.opt.ok{outline:6px solid var(--good);outline-offset:4px}
.opt.no{filter:saturate(.35) brightness(.9)}
.opt.dim{opacity:.35;filter:grayscale(.7)}
.opt .mark{position:absolute;top:12px;right:12px;background:#fff;border-radius:999px;padding:4px 12px;font-family:var(--f-body);font-weight:800;font-size:.9rem}
.opt.ok .mark{color:var(--good)}
.opt.no .mark{color:var(--bad)}
/* bigger play view */
.playing .wrap{max-width:1240px}
.playing .qcard h3{font-size:clamp(1.6rem,4.2vw,3.1rem);line-height:1.15;margin:16px 0 24px}
.playing .fb p{font-size:clamp(1rem,1.6vw,1.25rem)}
.timer{display:flex;align-items:center;gap:12px;margin:-8px 0 20px}
.tbar{flex:1;height:14px;border-radius:999px;background:var(--bg2);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;border-radius:inherit;background:var(--good);transform-origin:left;transition:background-color .3s}
.timer.warn .tbar i{background:var(--sun)}
.timer.hurry .tbar i{background:var(--bad)}
.tnum{flex:none;min-width:3.2em;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:2px 10px}
.qcard.warn{animation:jitter-s 1.4s ease-in-out infinite}
.qcard.hurry{animation:jitter-l .7s ease-in-out infinite}
.timer.stop .tbar i{opacity:.45}
/* short bursts with a rest in between, so the answers stay easy to tap */
@keyframes jitter-s{0%,40%,100%{transform:none}8%{transform:translateX(-4px) rotate(-.4deg)}16%{transform:translateX(4px) rotate(.4deg)}24%{transform:translateX(-3px)}32%{transform:translateX(2px)}}
@keyframes jitter-l{0%,60%,100%{transform:none}10%{transform:translateX(-9px) rotate(-1deg)}20%{transform:translateX(9px) rotate(1deg)}30%{transform:translateX(-7px) rotate(-.6deg)}40%{transform:translateX(6px) rotate(.6deg)}50%{transform:translateX(-3px)}}
@media (max-width:620px){.opts{gap:10px}.opt{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:max(150px,25vh);padding:16px;font-size:1.2rem;border-radius:16px}.opt .k{width:32px;height:32px}.opt .mark{top:8px;right:8px;font-size:.72rem;padding:2px 8px}}

.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pop{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.03)}}

.fb{margin-top:18px;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;animation:rise .3s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.3}}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb svg{width:56px;height:56px;grid-row:span 2}
.fb strong{font-family:var(--f-display);font-size:1.35rem;line-height:1.2}
.fb.ok strong{color:var(--good)}
.fb.no strong{color:var(--bad)}
.fb p{margin:0;min-width:0}
.fb .why{font-weight:800}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:14px;padding:12px 22px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-ink);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 #d39a00}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}

/* interstitial / results */
.panel{text-align:center;display:grid;justify-items:center;gap:10px;padding-block:8px}
.panel .mascot{width:140px;height:140px}
.panel h2{font-size:clamp(1.9rem,5vw,2.6rem)}
.panel p{margin:0;max-width:32em;color:var(--muted)}
.bigscore{display:grid;justify-items:center;gap:2px;margin-block:4px}
.bigscore small{font-size:.8rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bigscore b{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,9vw,4.6rem);line-height:1;color:var(--teal-ink);font-variant-numeric:tabular-nums}
.bigscore em{font-style:normal;font-weight:800;font-size:.95rem;color:var(--muted)}
.btn .count{display:inline-block;min-width:1.6em;margin-left:6px;background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.score{font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:var(--bg);border-radius:999px;padding:4px 16px;font-variant-numeric:tabular-nums}
.panel .actions{justify-content:center}
.recap{width:100%;text-align:left;display:grid;gap:8px;margin-top:8px}
.recap div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.95rem}
.recap i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.recap .y{background:var(--good)} .recap .n{background:var(--bad)}
.recap span{min-width:0}

/* animated background */
.wrap{position:relative;z-index:1}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wave{position:absolute;left:0;bottom:0;width:200%;display:block;animation:drift linear infinite}
.wave path{fill:var(--teal)}
.w1{height:150px;opacity:.10;animation-duration:22s}
.w2{height:115px;opacity:.13;animation-duration:15s;animation-direction:reverse}
.w3{height:80px;opacity:.16;animation-duration:10s}
.wtop{top:0;bottom:auto;height:90px;opacity:.07;transform:scaleY(-1);animation:drift-top 26s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes drift-top{from{transform:scaleY(-1) translateX(-50%)}to{transform:scaleY(-1) translateX(0)}}
.bub{position:absolute;bottom:-40px;border-radius:50%;border:2px solid var(--teal);opacity:0;animation:rise-bub linear infinite}
@keyframes rise-bub{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.35}50%{transform:translateY(-50vh) translateX(18px)}90%{opacity:.25}100%{transform:translateY(-105vh) translateX(-10px);opacity:0}}
#paint{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#paint.on{pointer-events:auto}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:620px){
  .hero{grid-template-columns:1fr}
  .hero .art{order:-1;width:100%;aspect-ratio:16/10;object-position:50% 72%;transform:none}
  .hero .mascot{display:none}
  .how{grid-template-columns:1fr}
  .how div{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center}
  .how i{grid-row:span 2;margin:0}
  .fb{grid-template-columns:1fr}
  .fb svg{display:none}
  .actions .btn{flex:1}
}
/* English | Bahasa Melayu switch in the top bar (home page only) */
.lang{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.lang button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9rem;color:var(--muted)}
.lang button[aria-selected="true"]{background:var(--teal);color:#fff}
.playing .lang{display:none}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lang .ls{display:none}
@media (max-width:620px){.lang .lf{display:none}.lang .ls{display:inline}.lang button{padding:6px 12px}.home .top{flex-wrap:wrap;row-gap:10px}.home .tr:has(.back){flex:1 0 100%;justify-content:space-between}}
.brand{text-align:left}
/* champion certificate, shown after 3 / 3 */
.champ{width:100%;max-width:640px;margin:8px auto 4px;position:relative;border-radius:22px;padding:6px;background:linear-gradient(135deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#3949ab,#8e24aa)}
.champ .in{background:var(--surface);border-radius:17px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;text-align:left}
.champ .who{display:grid;gap:4px;min-width:0}
.champ .who img{width:52px;height:52px;border-radius:50%}
.champ .eb{font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink)}
.playing .qcard .champ h3,.champ h3{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3.2vw,1.95rem);line-height:1.1;margin:0}
.champ h3 .hl{white-space:nowrap;background:var(--sun);color:var(--sun-ink);padding:0 .2em;border-radius:8px;display:inline-block;transform:rotate(-2deg)}
.champ .booth{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.2;margin-top:4px}
.champ .meta{color:var(--muted);font-size:.85rem;line-height:1.35}
.champ .qr{display:grid;justify-items:center;gap:6px;text-align:center}
.champ .qr svg{width:150px;height:150px;display:block;border-radius:10px;border:2px solid var(--line)}
.champ .qr span{font-size:.8rem;font-weight:800;color:var(--ink);max-width:170px;line-height:1.25}
@media (max-width:620px){.champ .in{grid-template-columns:1fr;text-align:center;justify-items:center}.champ .who{justify-items:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="bgfx" aria-hidden="true">
  <svg class="wave wtop" viewBox="0 0 2880 120" preserveAspectRatio="none"><path d="M0 60 Q360 0 720 60 T1440 60 T2160 60 T2880 60 V120 H0Z"/></svg>

const L=()=>T[LANG];
function setLang(l){
  LANG=l; pickBank(); document.documentElement.lang=l==="ms"?"ms":"en";
  document.getElementById("brand-t").textContent=L().brand;
  document.getElementById("home-btn").setAttribute("aria-label",L().home);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-selected",b.dataset.lang===l));
}

/* ---------- Mascot ---------- */
function mascot(mood, cls){
  const mouth = {
    happy:'<path d="M38 70 Q52 84 66 70" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>',
    wow:'<ellipse cx="52" cy="74" rx="7" ry="8" fill="var(--ink)"/>',
    sad:'<path d="M40 78 Q52 68 64 78" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>',
    think:'<path d="M42 74 L62 72" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>'
  }[mood||"happy"];
  const extra = mood==="wow" ? '<g stroke="var(--sun)" stroke-width="5" stroke-linecap="round"><path d="M8 18l8 8"/><path d="M50 2v10"/><path d="M92 18l-8 8"/></g>' :
                mood==="sad" ? '<path d="M84 52c4 6 6 10 3 13s-8 0-7-5c0-3 2-5 4-8z" fill="var(--iris)"/>' : '';
  return `<svg class="mascot ${cls||""}" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="52" cy="52" r="40" fill="var(--eye-white)" stroke="var(--ink)" stroke-width="5"/>
    <circle cx="52" cy="44" r="19" fill="var(--iris)"/>
    <circle cx="52" cy="44" r="9" fill="var(--ink)"/>
    <circle cx="58" cy="38" r="4.5" fill="#fff"/>
    ${mouth}${extra}</svg>`;
}

/* ---------- Randomising helpers ---------- */
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Shuffle answer options; keep "All of the above" as the last option.
// Shuffle all 4 options; "All of the above" stays last.
function prep(q){
  const idx=q.o.map((_,k)=>k);
  const allIdx=q.o.findIndex(x=>x==="All of the above"||x==="Semua jawapan di atas");
  const order=allIdx>=0?shuffle(idx.filter(k=>k!==allIdx)).concat(allIdx):shuffle(idx);
  return {q:q.q,e:q.e,o:order.map(k=>q.o[k]),a:order.indexOf(q.a),src:q};
}

/* ---------- State ---------- */
const app=document.getElementById("app");
let S=null; // {sec, attempt, used:[], qs:[], bonusQ, phase:'main'|'bonus', i, results:[], bonusResult}

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- Views ---------- */
function home(){
  stopTimer(); clearInterval(autoT); autoT=null; document.body.classList.add("home");
  S=null; document.body.classList.remove("playing");
  app.innerHTML=`
  <section class="hero">
    <div>
      <span class="label">${L().label}</span>
      <h1>${L().h1}</h1>
      <p>${L().intro}</p>
      <div class="byline"><img src="${LOGO}" alt="${L().logoAlt}"><div><span>${L().by}</span><strong>Brunei Ophthalmology Society</strong></div></div>
    </div>
    <img class="art" src="${ART}" alt="${L().artAlt}">
  </section>
  <div class="sec-head" style="margin-top:22px"><h2>${L().how}</h2></div>
  <div class="how" style="margin-top:0">
    ${L().steps.map((s,i)=>`<div><i>${i+1}</i><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join("")}
  </div>
  <div class="sec-head" style="justify-content:center"><h2>${L().pick}</h2></div>
  <div class="modewrap">
    <div class="mode" role="tablist" aria-label="${L().level}">
      <button role="tab" data-mode="kids" aria-selected="${MODE==="kids"}">${L().kids}</button>
      <button role="tab" data-mode="adult" aria-selected="${MODE==="adult"}">${L().adult}</button>
    </div>
    <p>${MODE==="kids"?L().kidsNote:L().adultNote}</p>
  </div>
  <div class="grid">
    ${SECTIONS.map((s,i)=>`<button class="card" style="${RAINBOW[i]}" data-sec="${i}" aria-label="${i+1}: ${NICK[i]}"><span class="num">${i+1}</span><span class="nick">${NICK[i]}</span></button>`).join("")}
  </div>
  <div class="foot">
    <p>${L().foot}</p>
  </div>`;
  app.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>start(+b.dataset.sec,1,[]));
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; pickBank(); const y=scrollY; RAW.home(); window.scrollTo({top:y}); });
  window.scrollTo({top:0});
}

function start(sec,attempt,used){
  const s=SECTIONS[sec];
  const all=s.sets.flat();
  let avail=all.filter(q=>!used.includes(q));
  if(avail.length<3){ avail=all; used=[]; }
  const picked=shuffle(avail).slice(0,3);
  S={sec,attempt,used:used.concat(picked),qs:picked.map(prep),
     bonusQ:prep(s.bonus[Math.floor(Math.random()*s.bonus.length)]),
     phase:"main",i:0,results:[],bonusResult:null};
  question();
}

function curQ(){ return S.phase==="bonus" ? S.bonusQ : S.qs[S.i]; }

function dotsHTML(){
  let h="";
  for(let k=0;k<3;k++){
    const r=S.results[k];
    const cls=r===true?"ok":r===false?"no":(S.phase==="main"&&k===S.i?"now":"");
    h+=`<span class="dot ${cls}">${r===true?"✓":r===false?"✗":k+1}</span>`;
  }
  if(S.phase==="bonus"){
    const r=S.bonusResult;
    h+=`<span class="dot bonus ${r===true?"ok":r===false?"no":"now"}">${L().bonusDot}</span>`;
  }
  return h;
}

function topHTML(){
  return `<div class="qtop">
    <div class="title"><span class="num" style="${RAINBOW[S.sec]}">${S.sec+1}</span><div><span class="nick">${L().section} ${S.sec+1} · ${MODE==="kids"?L().kids:L().adult}</span><h2>${NICK[S.sec]}</h2></div></div>
    <div class="dots" aria-label="${L().progress}">${dotsHTML()}</div>
  </div>`;
}

function question(){
  document.body.classList.add("playing"); document.body.classList.remove("home");
  const q=curQ();
  const tag = S.phase==="bonus" ? `<span class="tag bonus">${L().bonusQ}</span>`
            : `<span class="tag ${S.attempt>1?"retry":""}">${L().qOf(S.i+1)}${S.attempt>1?" · "+L().fresh:""}</span>`;
  app.innerHTML=`${topHTML()}
  <div class="qcard" id="qcard">
    ${tag}
    <h3>${esc(q.q)}</h3>
    <div class="timer" id="timer" role="timer" aria-label="${L().timeLeft}"><div class="tbar"><i id="tfill"></i></div></div>
    <div class="opts" role="group" aria-label="${L().answers}">
      ${q.o.map((t,k)=>`<button class="opt c${k}" data-k="${k}" aria-label="${L().shapes[k]}: ${esc(t)}"><span class="k">${SHAPES[k]}</span><span class="t">${esc(t)}</span></button>`).join("")}
    </div>
    <div id="fb"></div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  startTimer();
  window.scrollTo({top:0});
}

/* ---------- 40-second timer ---------- */
const LIMIT=40; let tRAF=null;
function stopTimer(){ if(tRAF){cancelAnimationFrame(tRAF);tRAF=null} const t=document.getElementById("timer"); if(t) t.classList.add("stop"); const c=document.getElementById("qcard"); if(c) c.classList.remove("warn","hurry"); }
function startTimer(){
  if(tRAF) cancelAnimationFrame(tRAF);
  const t0=performance.now(), fill=document.getElementById("tfill"), box=document.getElementById("timer"), card=document.getElementById("qcard");
  const step=now=>{
    const left=Math.max(0,LIMIT-(now-t0)/1000);
    fill.style.transform=`scaleX(${left/LIMIT})`;
    box.classList.toggle("warn",left<=20&&left>10);
    box.classList.toggle("hurry",left<=10);
    card.classList.toggle("warn",left<=20&&left>10);
    card.classList.toggle("hurry",left<=10);
    if(left<=0){ tRAF=null; answer(-1); return; }
    tRAF=requestAnimationFrame(step);
  };
  tRAF=requestAnimationFrame(step);
}

function answer(k){
  if(!S || app.querySelector(".opt:disabled")) return;
  stopTimer();
  const q=curQ(), ok=k===q.a;
  const opts=[...app.querySelectorAll(".opt")];
  opts.forEach((b,j)=>{
    b.disabled=true;
    if(j===q.a){b.classList.add("ok");b.insertAdjacentHTML("beforeend",`<span class="mark">${L().correct}</span>`)}
    else if(j===k){b.classList.add("no");b.insertAdjacentHTML("beforeend",`<span class="mark">${L().yourPick}</span>`)}
    else b.classList.add("dim");
  });
  if(S.phase==="bonus") S.bonusResult=ok; else S.results[S.i]=ok;
  app.querySelector(".dots").innerHTML=dotsHTML();
  const card=document.getElementById("qcard");
  if(ok){ card.classList.add("pop"); confetti(opts[k]); }
  else { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }

  const last = S.phase==="bonus" || S.i===2;
  const praise=L().praise[Math.floor(Math.random()*4)];
  document.getElementById("fb").innerHTML=`
    <div class="fb ${ok?"ok":"no"}">
      ${mascot(ok?"wow":"sad")}
      <strong>${ok?praise:k<0?L().timeUp:L().notQuite}</strong>
      <p>${ok?"":L().answerIs(esc(q.o[q.a]))}<span class="why">${L().why}</span> ${esc(q.e)}</p>
    </div>
    <div class="actions"><button class="btn" id="next">${last?L().seeScore:L().nextQ} →${last?`<span class="count" id="count">${AUTO}</span>`:""}</button></div>`;
  const nx=document.getElementById("next"); nx.onclick=next; nx.focus({preventScroll:true});
  if(last){
    // Final question: go to the score page automatically after a short pause to read the explanation.
    let n=AUTO; autoT=setInterval(()=>{ n--; const c=document.getElementById("count"); if(c) c.textContent=n; if(n<=0) next(); },1000);
  }
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}

const AUTO=6; let autoT=null;
function next(){
  clearInterval(autoT); autoT=null;
  if(S.phase==="main" && S.i<2){ S.i++; question(); return; }
  results();
}

function recapHTML(){
  const qs=S.qs.slice(), rs=S.results.slice();
  if(S.phase==="bonus"){ qs.push(S.bonusQ); rs.push(S.bonusResult); }
  return `<div class="recap">${qs.map((q,k)=>`<div><i class="${rs[k]?"y":"n"}">${rs[k]?"✓":"✗"}</i><span>${esc(q.q)}<br><b>${esc(q.o[q.a])}</b></span></div>`).join("")}</div>`;
}

function scoreHTML(right){
  const b=S.phase==="bonus";
  return `<div class="bigscore"><small>${L().yourScore}</small><b>${right} / 3</b>${b?`<em>${S.bonusResult?L().bonusOk:L().bonusNo}</em>`:""}</div>`;
}
function champHTML(){
  const d=new Date().toLocaleDateString(L().dateLoc,{day:"numeric",month:"long",year:"numeric"});
  return `<div class="champ"><div class="in">
    <div class="who">
      <img src="${LOGO}" alt="${L().logoAlt}">
      <span class="eb">${L().cert}</span>
      <h3>${L().champ}</h3>
      <div class="booth">${L().booth}</div>
      <div class="meta">Brunei Ophthalmology Society<br>${L().section} ${S.sec+1} · ${NICK[S.sec]} · ${MODE==="kids"?L().kids:L().adult} · ${d}</div>
    </div>
    <div class="qr">${CERT_QR}<span>${L().scan}</span></div>
  </div></div>`;
}
function results(){
  const right=S.results.filter(Boolean).length;
  const nextSec=(S.sec+1)%SECTIONS.length;
  const moveOn=`<div class="actions">
        <button class="btn ghost" data-go="home">${L().allSections}</button>
        <button class="btn" data-go="next">${L().next(NICK[nextSec])}</button>
      </div>`;
  let body;

  if(S.phase==="bonus"){
    body=`${mascot(S.bonusResult?"wow":"happy")}
      ${scoreHTML(right)}
      <h2>${L().complete(NICK[S.sec])}</h2>
      <p>${S.bonusResult?L().bonusWin:L().bonusLose}</p>
      ${recapHTML()}${moveOn}`;
    if(S.bonusResult) setTimeout(()=>bigConfetti(),150);
  } else if(right===3){
    body=`${mascot("wow","bob")}
      ${scoreHTML(right)}
      <h2>${L().all3}</h2>
      <p>${L().all3p}</p>
      ${champHTML()}
      ${recapHTML()}${moveOn}`;
    setTimeout(()=>bigConfetti(),150);
  } else if(right>0){
    body=`${mascot("think")}
      ${scoreHTML(right)}
      <h2>${L().nearly}</h2>
      <p>${L().nearlyP(right)}</p>
      <div class="actions"><button class="btn sun" data-go="bonus">${L().tryBonus}</button></div>`;
  } else {
    body=`${mascot("sad")}
      ${scoreHTML(right)}
      <h2>${L().fresh0}</h2>
      <p>${L().fresh0p}</p>
      ${recapHTML()}
      <div class="actions">
        <button class="btn ghost" data-go="home">${L().allSections}</button>
        <button class="btn" data-go="retry">${L().tryNew}</button>
      </div>`;
  }
  app.innerHTML=`${topHTML()}<div class="qcard panel">${body}</div>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==="home") home();
    else if(g==="next") start(nextSec,1,[]);
    else if(g==="bonus"){ S.phase="bonus"; question(); }
    else if(g==="retry") start(S.sec,S.attempt+1,S.used);
  });
  window.scrollTo({top:0});
}

/* ---------- Keyboard: A–D or 1–4 to answer, Enter for next ---------- */
document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey) return;
  const map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  const k=map[e.key.toLowerCase()];
  const opts=app.querySelectorAll(".opt:not(:disabled)");
  if(k!==undefined && opts.length===4){ opts[k].click(); }
});
document.getElementById("home-btn").onclick=home;
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ if(b.dataset.lang===LANG) return; setLang(b.dataset.lang); const y=scrollY; RAW.home(); window.scrollTo({top:y}); });

/* ---------- Confetti ---------- */
const cv=document.getElementById("confetti"), cx=cv.getContext("2d");
let parts=[], raf=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function colors(){const cs=getComputedStyle(document.documentElement);return ["--sun","--teal","--good","--iris","--bad"].map(v=>cs.getPropertyValue(v).trim()||"#ffc531")}
function burst(x,y,n,spread,power){
  if(reduce) return;
  const c=colors();
  for(let i=0;i<n;i++){
    const ang=-Math.PI/2+(Math.random()-.5)*spread, sp=power*(.5+Math.random());
    parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,g:.25+Math.random()*.15,s:5+Math.random()*6,
      r:Math.random()*6,vr:(Math.random()-.5)*.3,c:c[i%c.length],life:0,shape:Math.random()<.3?"c":"r"});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function confetti(el){
  const r=el.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,70,Math.PI*1.1,13);
}
function bigConfetti(){
  const w=innerWidth,h=innerHeight;
  burst(w*.2,h*.9,90,1.2,20); burst(w*.8,h*.9,90,1.2,20);
  setTimeout(()=>burst(w*.5,h*.8,80,1.6,18),250);
}
function tick(){
  const dpr=devicePixelRatio||1;
  if(cv.width!==innerWidth*dpr){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30&&p.life<260);
  for(const p of parts){
    p.life++; p.vx*=.985; p.vy=p.vy*.985+p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    if(p.shape==="c"){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()} else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2*Math.abs(Math.cos(p.life*.1+p.r))+1);
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}

/* ---------- Paint-pour transition between screens ---------- */
// A wave of paint pours down with drips, the screen changes while it is covered,
// then the paint slides off the bottom. Colours cycle through the rainbow.
const PAINT=["#e53935","#fb8c00","#fdd835","#43a047","#1e88e5","#3949ab","#8e24aa"];
const pv=document.getElementById("paint"), px=pv.getContext("2d");
let paintIdx=0, painting=false;
const RAW={home,question,results};
function drips(W,D){
  const n=Math.max(8,Math.round(W/70)), out=[];
  for(let i=0;i<n;i++) out.push({c:(i+.2+Math.random()*.6)*W/n, w:W/n*(.28+Math.random()*.3), L:D*(.25+Math.random()*.75)});
  return out;
}
function edge(x,ds,D,ph){
  let d=D*.12*Math.sin(x/90+ph);
  for(const k of ds){const u=(x-k.c)/k.w; if(u>-1&&u<1) d=Math.max(d,k.L*Math.sqrt(1-u*u));}
  return d;
}
function swap(fn){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ fn(); return; }
  if(painting) return;
  painting=true; pv.classList.add("on");
  const col=PAINT[paintIdx++%PAINT.length];
  const W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;
  pv.width=W*dpr; pv.height=H*dpr; px.setTransform(dpr,0,0,dpr,0,0);
  const D=Math.min(160,H*.18), d1=drips(W,D), d2=drips(W,D), ph=Math.random()*6;
  const DUR=1000, t0=performance.now(); let swapped=false;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const shape=(top,bot)=>{px.beginPath();const step=6;
    px.moveTo(0,top(0));for(let x=0;x<=W+step;x+=step)px.lineTo(x,top(x));
    for(let x=W+step;x>=-step;x-=step)px.lineTo(x,bot(x));px.closePath();px.fill();};
  const frame=now=>{
    const t=Math.min(1,(now-t0)/DUR);
    px.clearRect(0,0,W,H);
    let top,bot;
    if(t<.5){const e=ease(t/.5); top=()=>-10; bot=x=>e*(H+2*D)-D+edge(x,d1,D,ph);}
    else{const e=ease((t-.5)/.5); bot=()=>H+10; top=x=>e*(H+3*D)-D-edge(x,d2,D,ph+2);}
    px.fillStyle=col; px.globalAlpha=.35; shape(x=>top(x)-14,x=>bot(x)+14);
    px.globalAlpha=1; shape(top,bot);
    if(t>=.5&&!swapped){swapped=true; fn();}
    if(t<1) requestAnimationFrame(frame); else {px.clearRect(0,0,W,H); pv.classList.remove("on"); painting=false;}
  };
  requestAnimationFrame(frame);
}
home=function(){ swap(RAW.home); };
question=function(){ swap(RAW.question); };
results=function(){ swap(RAW.results); };

RAW.home();
</script>
