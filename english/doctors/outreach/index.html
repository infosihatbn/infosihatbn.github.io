<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Vision Tools · MataKitani for Doctors</title>
<link rel="icon" href="/assets/favicon-32.png">
<style>
/* MataKitani outreach vision tools (Haziq, 2026-11-22): calibrated visual acuity chart, phone remote by QR, colour vision plates */
:root{--ink:#10283a;--mut:#5a6b78;--acc:#1e6fa8;--acc2:#e7f1f9;--line:#d9e3ea;--ok:#1f8a4c;--bad:#c0392b;--bg:#f4f7fa}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* display (PC / TV), layout after Haziq's reference app (2026-11-22) */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
.top{display:flex;align-items:center;gap:6px;padding:8px max(12px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#fff}
.ib{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;border:0;background:none;color:#000;cursor:pointer;flex:none;text-decoration:none}
.ib:hover{background:#f0f3f6}.ib svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib.gl svg{width:26px;height:26px;stroke:none}.tools{display:flex;gap:2px}
.tabs{display:flex;gap:2px;background:#f0f3f6;border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--mut);font-size:14.5px}.tabs button[aria-selected=true]{background:#000;color:#fff}
.top .sp{flex:1}
.stage{flex:1;position:relative;overflow:hidden;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
.stage.scroll{overflow-y:auto;align-items:flex-start;justify-content:stretch}
.stage.con1{background:#000;color:#fff}.stage.con2{color:#e1e1e1}
.ladder{width:100%;padding:6px 0 18px}
.ladder.mir,.chart.mir{transform:scaleX(-1)}
.row{position:relative;display:flex;align-items:center;justify-content:center;padding-inline:20px;cursor:pointer;border-left:4px solid transparent}
.row.cur{border-left-color:var(--acc)}
.row .lt{display:flex;align-items:center;justify-content:center;min-width:0}
.rl{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:15px;color:#555;font-variant-numeric:tabular-nums;white-space:nowrap}
.con1 .rl,.con1 .lab,.con1 .fn{color:#9aa}.con2 .rl,.con2 .lab{color:#777}
.fn{font-size:13px;color:#888;padding:4px 20px;margin:0}.nofit{padding:20px;text-align:center;color:#888}
.chart{display:flex;align-items:center;justify-content:center}
.opt{display:block;flex:none}
.lab{position:absolute;right:18px;bottom:12px;font-size:15px;color:#555;font-variant-numeric:tabular-nums}
.updn{position:absolute;left:12px;bottom:10px;display:flex;gap:6px}.updn .ib{background:#f0f3f6;color:#000}.con1 .updn .ib{background:#222;color:#fff}
.warn{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff4e5;color:#8a4b00;border:1px solid #f2c48d;border-radius:10px;padding:6px 12px;font-size:14px;max-width:90%;text-align:center}
.bar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:#fff}
.cd{margin:0;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}.cd.sm{font-weight:500;font-size:13px;color:var(--mut);text-align:center}
.seg{display:flex;border:1.5px solid #000;border-radius:10px;overflow:hidden;max-width:100%}
.seg button{border:0;background:#fff;padding:9px 22px;font-size:17px;cursor:pointer;color:#000}.seg button+button{border-left:1px solid #ddd}
.seg button[aria-checked=true]{background:#000;color:#fff}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hide-ui .top,.hide-ui .bar,.hide-ui .updn{display:none}
.hide-ui .row.cur{border-left-color:transparent}
@media (max-width:560px){.seg button{padding:8px 12px;font-size:15px}.top{gap:2px;padding-inline:4px}.tools{gap:0}.ib{width:36px;height:36px}.ib svg{width:22px;height:22px}.ib.gl svg{width:21px;height:21px}.top .hp{display:none}.tabs{padding:2px}.tabs button{padding:5px 8px;font-size:13.5px}}
.uncal{margin:0;font-size:13.5px;color:#8a4b00;background:#fff4e5;border-radius:8px;padding:4px 10px;cursor:pointer;border:0}
.keys{font-size:13px}
/* colour vision */
.cv{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;width:100%;height:100%;justify-content:center}
.cv canvas{width:min(62vh,88vw);height:min(62vh,88vw);border-radius:50%;background:#fff}
.cv .ttl{font-weight:700;color:var(--mut)}
.cv .ans{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.res{max-width:620px;padding:18px 22px;border:1px solid var(--line);border-radius:18px;background:var(--bg)}
.res h2{margin:0 0 6px;font-size:22px}.res ul{margin:8px 0;padding-left:20px}.res .note{font-size:14px;color:var(--mut)}
.peek{font-size:14px;color:var(--mut);min-height:20px}
/* dialogs */
dialog{border:0;border-radius:20px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,30,45,.45)}
.dlg{padding:18px 20px 20px}.dlg h2{margin:0 0 4px;font-size:20px}.dlg p{margin:6px 0;color:var(--mut);font-size:14.5px}
.dlg label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-weight:600}
.dlg select,.dlg input[type=number]{min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;background:#fff;min-width:150px}
.dlg .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;line-height:1}
.card{height:54px;border:2.5px solid var(--acc);border-radius:7px;margin:10px 0;background:repeating-linear-gradient(90deg,var(--acc2) 0 10px,#fff 10px 20px)}
.qr{display:grid;place-items:center;background:#fff;padding:10px;margin:8px auto;width:min(280px,80vw)}.qr svg{width:100%;height:auto}
.url{font-size:12px;word-break:break-all;text-align:center;color:var(--mut)}
.st{text-align:center;font-weight:700}.rm .st{font-size:13px;font-weight:600;color:var(--mut);text-align:right;max-width:55%}.st.ok{color:var(--ok)}
/* phone remote */
.rm{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100%}
.rm h1{font-size:18px;margin:0;display:flex;justify-content:space-between;align-items:center}
.rm .big{font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.rm .sub2{text-align:center;color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips button{min-width:52px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:26px;font-weight:800;cursor:pointer}
.chips button.x{border-color:var(--bad);background:#fdecea;color:var(--bad);text-decoration:line-through}
.chips button.cur{border-color:var(--acc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rm .btn{min-height:54px;font-size:16px}
.rm .huge{min-height:70px;font-size:19px}
.rec{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:15px}.rec b{display:block;margin-bottom:4px}.rec ol{margin:0;padding-left:20px}
.rm select{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;background:#fff;width:100%}
.ansbig{font-size:46px;font-weight:900;text-align:center;letter-spacing:.04em}
.ansbig .l{color:#c2185b}.ansbig .r{color:#6a1b9a}
</style></head>

  else if (ne === cls.length && wrong >= 3) type = 'Could not see the classification digits: possibly a severe defect. Type unclear.';
  return { h: 'Possible red-green colour vision deficiency', b: [`Missed ${wrong} of ${vi.length} screening plates.`, type, 'Advise a full assessment with an optometrist or eye clinic (Ishihara, with HRR or anomaloscope if needed). Mention it for school, driving or work that relies on colour.'], c: 'bad' };
};

        ${p.t === 'cls' ? `<div class="ansbig"><span class="l">${p.n[0]}</span> <span class="r">${p.n[1]}</span></div><p class="sub2">Normal reads ${p.n}. Deutan sees ${p.n[0]} only, protan sees ${p.n[1]} only.</p>
          <div class="g2"><button class="btn ok huge" data-v="both">Both</button><button class="btn bad huge" data-v="neither">Neither</button><button class="btn huge" data-v="left">${p.n[0]} only</button><button class="btn huge" data-v="rightonly">${p.n[1]} only</button></div>`
        : `<div class="ansbig">${p.n}</div><div class="g2"><button class="btn ok huge" data-v="right">Correct</button><button class="btn bad huge" data-v="wrong">Wrong / nothing</button></div>`}
        ${c.i ? '<button class="btn" data-c="cvback">‹ Back one plate</button>' : ''}`;
    }
  };
  body.addEventListener('click', e => {
    const t = e.target.closest('button[data-tab]'); if (t) return send('tab', t.dataset.tab);
    const m = e.target.closest('[data-mk]'); if (m) { marks[+m.dataset.mk] = !marks[+m.dataset.mk]; render(); return; }
    const r = e.target.closest('[data-rec]'); if (r) { const L = LINES[S.li], w = marks.filter(Boolean).length; recs.push(`${r.dataset.rec}: ${note(L[0], S.note)}${w ? ' −' + w : ''} (${CHARTS[S.chart].split(' (')[0]}, ${fmtD(S.dist)})`); render(); return; }
    const v = e.target.closest('[data-v]'); if (v) { if (navigator.vibrate) navigator.vibrate(10); return send('cv', v.dataset.v); }
    const b = e.target.closest('[data-c]'); if (b) { if (['bigger', 'smaller', 'new', 'single'].includes(b.dataset.c)) marks = []; send(b.dataset.c); }
  });
  body.addEventListener('change', e => { const k = e.target.dataset.set; if (!k) return; marks = []; send('set', [k, k === 'dist' ? +e.target.value : e.target.value]); });
  (async () => {
    try { await loadJS('/assets/xr/peerjs.min.js'); } catch (e) { st.textContent = 'Offline'; return; }
    const connect = () => { const peer = new window.Peer(); peer.on('open', () => { conn = peer.connect(id, { reliable: true }); conn.on('open', () => { st.textContent = 'Connected'; st.classList.add('ok'); conn.send({ c: 'hello' }); }); conn.on('data', d => { if (d && d.t === 'st') { const ch = !S || S.li !== d.s.li || JSON.stringify(S.opts) !== JSON.stringify(d.s.opts); S = d.s; if (ch) marks = []; render(); } }); conn.on('close', () => { st.textContent = 'Disconnected'; st.classList.remove('ok'); }); }); peer.on('error', () => { st.textContent = 'Not connected: scan again'; }); };
    connect();
  })();
}
})();
</script>
</body></html>
